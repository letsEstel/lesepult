<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontsHref}}">
<style>
/* Lesepult — 内容就是界面。
   页面上每一样东西，要么帮你读懂，要么帮你找到、记住或回到某处；两样都不沾的，删掉。
   1 纯净：没有装饰、没有粗框和阴影、没有为好看而加的动画。
   2 克制的颜色：白底黑字，只有一个点缀色 --accent（#2f5d8a），只用于：链接、当前位置、例句左边的竖线。
     （「语法着色」是用户自己打开的读懂工具，不算装饰，保留它的几种格的颜色。）
   3 字体像一本好书：中文正文宋体，德语正文用书的衬线体；界面文字（目录、按钮、标签）无衬线。每行不超过约 46 个汉字宽，行距宽松。
   4 会动的只有内容：朗读时高亮跟着走；除此之外没有过渡、没有平滑滚动。
   5 像一个正经产品：顶栏、目录、搜索、继续阅读、进度都在，不用的时候几乎看不见。 */
:root{
  --paper:#ffffff; --sheet:#ffffff; --sheet-2:#f5f5f3; --ink:#1a1a1a; --ink-2:#4a4a4a; --ink-3:#8a8a8a;
  --rule:#e6e6e3; --rule-2:#cfcfcb;
  --accent:#2f5d8a; --accent-soft:#eaf0f6;
  /* old names, kept so book data and lesson HTML that mention them still work */
  --prussian:var(--accent); --prussian-2:var(--accent); --prussian-soft:var(--accent-soft); --wax:var(--ink);
  --c-n:#3b64a8; --c-a:#b0503a; --c-d:#3a7d5c; --c-g:#9a7420; --c-v:#6d4890;
  --hl:var(--accent-soft); --ok:var(--ink-2); --bad:var(--ink-3); --shadow:none;
  --f-de:Georgia,"Times New Roman",serif;
  --f-frak:Georgia,serif;
  --f-zh:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --f-mono:var(--f-ui);
  --measure:46rem;          /* ≈ 46 个汉字 */
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --paper:#151617; --sheet:#151617; --sheet-2:#1e2022; --ink:#e6e6e3; --ink-2:#b4b4b0; --ink-3:#808080;
  --rule:#2a2c2e; --rule-2:#3c3e41; --accent:#8fb3d9; --accent-soft:#1f2a36;
  --c-n:#8bb0ef; --c-a:#ee9a82; --c-d:#7fcca4; --c-g:#ddb867; --c-v:#c4a3e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151617; --sheet:#151617; --sheet-2:#1e2022; --ink:#e6e6e3; --ink-2:#b4b4b0; --ink-3:#808080;
  --rule:#2a2c2e; --rule-2:#3c3e41; --accent:#8fb3d9; --accent-soft:#1f2a36;
  --c-n:#8bb0ef; --c-a:#ee9a82; --c-d:#7fcca4; --c-g:#ddb867; --c-v:#c4a3e6; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
/* Older themes, kept as options (not defaults). They bring their own palette, and their accent colours more of the page;
   纸本 also lets each book use its own accent (set in setBookStyle). */
:root[data-theme="paper"]{
  --paper:#f3f4f1; --sheet:#fbfbf9; --sheet-2:#eaece7; --ink:#191d25; --ink-2:#454c5a; --ink-3:#757c8a;
  --rule:#d8dbd3; --rule-2:#c6cac0; --accent:#1e3c6a; --accent-soft:#e2e8f1; color-scheme:light}
:root[data-theme="wabi"]{
  --paper:#eeeae3; --sheet:#f6f3ee; --sheet-2:#e5dfd5; --ink:#2b2824; --ink-2:#57524b; --ink-3:#8a847a;
  --rule:#dbd4c8; --rule-2:#c8bfb0; --accent:#6b5a45; --accent-soft:#e6ddcf;
  --c-n:#4f6a86; --c-a:#a0553c; --c-d:#4d7a5c; --c-g:#8c6d2c; --c-v:#76587f; color-scheme:light;
  --f-frak:"Literata",Georgia,serif}
:root[data-theme="roma"]{
  --paper:#f3eee4; --sheet:#fbf8f1; --sheet-2:#ebe3d4; --ink:#241a14; --ink-2:#4f4238; --ink-3:#837668;
  --rule:#e0d5c3; --rule-2:#ccbda6; --accent:#962b1f; --accent-soft:#f3e0d5;
  --c-n:#2f5a8f; --c-a:#b5432e; --c-d:#3a7350; --c-g:#9a6f12; --c-v:#6d3f7d; color-scheme:light;
  --f-frak:"Cinzel","Trajan Pro",Georgia,serif}
:root[data-theme="aka"]{
  --paper:#0f0b0b; --sheet:#191313; --sheet-2:#241a1a; --ink:#f5ede7; --ink-2:#cbbdb4; --ink-3:#928279;
  --rule:#342628; --rule-2:#4b393a; --accent:#ff4b37; --accent-soft:#3b1410;
  --c-n:#7fb0ff; --c-a:#ff7a5c; --c-d:#5fdc9e; --c-g:#ffc145; --c-v:#d69bff; color-scheme:dark}
:root[data-theme="roma"] .lib-mast,:root[data-theme="roma"] .mast{letter-spacing:.04em}
:root:is([data-theme="paper"],[data-theme="wabi"],[data-theme="roma"],[data-theme="aka"]) :is(.lib-mast,.mast,.brand .frak,.lesson .ln,.ch-n,.cc-n){color:var(--accent)}
:root:is([data-theme="paper"],[data-theme="wabi"],[data-theme="roma"],[data-theme="aka"]) .btn.pri{background:var(--accent);border-color:var(--accent)}
:root:is([data-theme="paper"],[data-theme="wabi"],[data-theme="roma"],[data-theme="aka"]) :is(.ch-s .bar i){background:var(--accent)}
:root:is([data-theme="paper"],[data-theme="wabi"],[data-theme="roma"],[data-theme="aka"]) :is(.cc-prog i,.bk-prog i){background:linear-gradient(to right,var(--accent) var(--p),var(--rule) var(--p))}

*{box-sizing:border-box}
*,*::before,*::after{transition:none!important;animation:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:auto}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.7 var(--f-ui);margin:0;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
i,em{font-family:var(--f-de)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.2em}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (min-width:720px){.wrap{padding-inline:32px}}
.icon-btn{border:0;background:none;border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink-3)}
.icon-btn:hover{color:var(--ink);background:var(--sheet-2)}
.icon-btn[aria-pressed="true"]{color:var(--ink)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}
.icon-btn svg{width:17px;height:17px}

/* ---- top bar: where you are ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{position:relative;display:flex;align-items:center;gap:14px;min-height:50px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);flex:none}
@font-face{font-family:"LP Fraktur";src:url(fraktur.woff) format("woff");font-display:swap}
.fk{font-family:"LP Fraktur","UnifrakturMaguntia",serif;font-size:1.3em;line-height:1.7;letter-spacing:.02em}
.brand .frak{font:24px/1 var(--f-frak);color:var(--ink)}
.brand .bt{font:600 14.5px/1.2 var(--f-ui);white-space:nowrap;letter-spacing:.01em}
@media (max-width:560px){.brand .bt{display:none}}
.ctx-name{font:14px/1.2 var(--f-ui);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:16em;padding-left:14px;border-left:1px solid var(--rule)}
@media (max-width:760px){.ctx-name{display:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0;align-self:stretch}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:0 10px;cursor:pointer;color:var(--ink-3);white-space:nowrap;font-size:14px;box-shadow:inset 0 -2px 0 transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tab .cnt{font-size:11.5px;margin-left:4px;color:var(--ink-3)}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;border-radius:6px;padding:5px 8px 5px 2px;cursor:pointer;font-size:13.5px;color:var(--ink-2);flex:none;max-width:46vw}
.back:hover{color:var(--ink);background:var(--sheet-2)}
.back svg{width:18px;height:18px;flex:none}
.back #backLbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:3px}
@media (max-width:560px){.back .bk-pre{display:none}.back{max-width:38vw}.top-in{gap:8px}}
.prog{height:2px;background:transparent}
.prog i{display:block;height:100%;width:0;background:var(--accent)}

/* theme menu: automatic / day / night only */
.theme-btn{margin-left:auto}
.tabs:not([hidden]) ~ .theme-btn{margin-left:0}
.theme-menu{position:absolute;right:20px;top:calc(100% + 4px);z-index:40;width:min(260px,calc(100vw - 40px));background:var(--paper);border:1px solid var(--rule-2);border-radius:8px;padding:4px}
@media (min-width:720px){.theme-menu{right:32px}}
.theme-menu h4{font:500 12px var(--f-ui);color:var(--ink-3);margin:6px 10px 2px}
.theme-menu .th-opt+h4{border-top:1px solid var(--rule);margin:6px 0 2px;padding:10px 10px 0}
.th-opt{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer}
.th-opt:hover,.th-opt:focus-visible{background:var(--sheet-2)}
.th-opt b{font:500 14px var(--f-ui)}
.th-opt small{grid-column:1;font-size:12.5px;color:var(--ink-3);line-height:1.45}
.th-sw{display:none}
.th-ck{grid-row:1/span 2;grid-column:2;width:16px;height:16px;color:var(--accent);visibility:hidden}
.th-opt[aria-checked="true"] .th-ck{visibility:visible}

/* ---- shared type ---- */
.eyebrow{font:500 12.5px/1.4 var(--f-ui);letter-spacing:.04em;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule-2);background:var(--paper);padding:8px 14px;border-radius:6px;cursor:pointer;font:14px var(--f-ui);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn svg{width:15px;height:15px;flex:none}
.sec-head{padding-block:40px 12px;max-width:var(--measure)}
.sec-head h2{font:600 clamp(24px,3.2vw,30px)/1.3 var(--f-zh);margin:6px 0 6px;text-wrap:balance}
.sec-head p{margin:0;color:var(--ink-2);font:15.5px/1.85 var(--f-zh)}
.mast-sub{font:italic 400 clamp(17px,2.2vw,20px)/1.5 var(--f-de);color:var(--ink-2);margin:0;text-wrap:balance}
.lede{font:16.5px/1.95 var(--f-zh);margin:18px 0 0;max-width:var(--measure);color:var(--ink)}

/* ---- library ---- */
.lib-hero{padding-block:56px 28px;max-width:var(--measure)}
.lib-mast{font:clamp(56px,10vw,96px)/.95 var(--f-frak);color:var(--ink);margin:10px 0 12px;font-weight:400}
.shelf-h{display:flex;align-items:baseline;gap:12px;font:600 13px/1.3 var(--f-ui);letter-spacing:.04em;color:var(--ink-2);margin:44px 0 0;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.shelf-h small{font:12.5px var(--f-ui);color:var(--ink-3);letter-spacing:0;font-weight:400}
.lib-cont{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;max-width:var(--measure);margin:0 0 8px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer;font:15px var(--f-ui);color:var(--accent)}
.lib-cont:hover span{text-decoration:underline;text-underline-offset:.25em}
.lib-cont svg{width:16px;height:16px;flex:none}
.lib-cont b{font:600 15px var(--f-zh);margin:0 .5em;color:var(--ink)}
.lib-cont i{font:13px var(--f-ui);font-style:normal;color:var(--ink-3)}
.course-row{display:grid}
.course-card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:3rem minmax(0,1fr);gap:4px 16px;align-items:start;padding:18px 0;border-bottom:1px solid var(--rule);max-width:var(--measure)}
.course-card:hover b{color:var(--accent)}
.cc-n{grid-row:span 2;font:400 30px/1.1 var(--f-de);color:var(--ink-3);text-align:left}
.cc-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cc-body b{font:600 17.5px/1.45 var(--f-zh)}
.cc-de{font:italic 14px var(--f-de);color:var(--ink-3)}
.cc-p{font:14.5px/1.8 var(--f-zh);color:var(--ink-2);margin-top:4px}
.cc-prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.cc-prog i,.bk-prog i{display:block;flex:1;max-width:160px;height:2px;background:linear-gradient(to right,var(--ink-2) var(--p),var(--rule) var(--p))}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));column-gap:40px;margin-bottom:72px}
.book{all:unset;box-sizing:border-box;display:flex;flex-direction:column;padding:22px 0 24px;border-bottom:1px solid var(--rule);cursor:pointer;min-width:0}
.book:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.bk-cover{display:flex;flex-direction:column;gap:6px;color:var(--ink);padding:0 0 10px}
.bk-mast{font:clamp(28px,3.2vw,34px)/1.05 var(--bk-font);overflow-wrap:anywhere;order:2}
.bk-au{font:500 12px var(--f-ui);letter-spacing:.04em;color:var(--ink-3);order:1}
button.book:hover .bk-title{color:var(--accent)}
.bk-body{display:flex;flex-direction:column;gap:2px;flex:1}
.bk-level{font-size:12.5px;color:var(--ink-3);order:9;margin-top:8px}
.bk-title{font:600 16.5px/1.5 var(--f-zh)}
.bk-de{font:italic 14px var(--f-de);color:var(--ink-3)}
.bk-blurb{font:14.5px/1.85 var(--f-zh);color:var(--ink-2);margin:8px 0 12px;flex:1}
.bk-prog{display:flex}
.bk-stat{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.bk-last{display:block;font:13px var(--f-zh);color:var(--accent);margin-top:4px}
.bk-chip{align-self:flex-start;font-size:12.5px;color:var(--ink-3)}
.book.planned{cursor:default}
.book.planned .bk-cover,.book.planned .bk-title{color:var(--ink-3)}
.basics-link{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:var(--measure);margin:4px 0 16px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);color:var(--ink);font:14.5px/1.7 var(--f-zh)}
.basics-link b{font-weight:600}
.basics-link svg{width:16px;height:16px;flex:none;color:var(--accent)}
.basics-link:hover b{color:var(--accent)}

/* ---- book home ---- */
.hero{padding-block:52px 32px;display:grid;gap:36px}
@media (min-width:960px){.hero{grid-template-columns:1fr 1fr;align-items:end;padding-block:72px 40px}}
.mast{font:clamp(50px,9vw,96px)/.98 var(--f-frak);color:var(--ink);margin:10px 0 8px;overflow-wrap:anywhere;font-weight:400}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.demo{padding:4px 0 0 24px;border-left:1px solid var(--rule);min-width:0}
.demo-cap{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px}
.demo .zh{margin-top:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px 36px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0;margin-block:8px 40px}
.stat b{display:block;font:400 24px/1.2 var(--f-de)}
.stat span{font-size:12.5px;color:var(--ink-3)}
.how{display:grid;gap:22px;margin-bottom:64px}
@media (min-width:760px){.how{grid-template-columns:repeat(3,1fr);gap:36px}}
.how h3{font:600 16px/1.5 var(--f-zh);margin:0 0 6px}
.how p{margin:0;color:var(--ink-2);font:14.5px/1.85 var(--f-zh)}
.how .n{font-size:12.5px;color:var(--ink-3)}

/* ---- lessons ---- */
.lessons{display:grid;padding-bottom:72px;max-width:calc(var(--measure) + 4rem);border-top:1px solid var(--rule)}
.lesson{border-bottom:1px solid var(--rule)}
.lesson>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.4rem 1fr auto;gap:14px;align-items:baseline;width:100%;padding:16px 0;cursor:pointer}
.lesson>button:hover .lt{color:var(--accent)}
.lesson>button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lesson .ln{font:400 15px var(--f-de);color:var(--ink-3)}
.lesson.done .ln{color:var(--ink)}
.lesson.done .ln::after{content:" ✓";font:12px var(--f-ui)}
.lesson .lt{font:600 17px/1.45 var(--f-zh);display:block}
.lesson .ls{font:italic 14px var(--f-de);color:var(--ink-3)}
.lesson .lm{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.lesson-body{padding:4px 0 32px 3.4rem;font:16px/1.95 var(--f-zh);min-width:0;max-width:calc(var(--measure) + 3.4rem)}
@media (max-width:560px){.lesson-body{padding-left:0}}
.lesson-body p{margin:.9em 0}
.lesson-body h4{font:600 17px/1.5 var(--f-zh);margin:2em 0 .4em}
.lesson-body ul{padding-left:1.2em}
.lesson-body li{margin:.4em 0}
.lesson-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.lcont{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;max-width:var(--measure);padding:12px 0;margin-bottom:4px;color:var(--accent);font:15px var(--f-ui);cursor:pointer}
.lcont:hover{text-decoration:underline;text-underline-offset:.25em}
.lcont svg{width:16px;height:16px;flex:none}
.lcont b{font-weight:600}
/* examples: the accent's third and last job */
.ex{display:block;margin:14px 0;padding:2px 0 2px 16px;border-left:2px solid var(--accent)}
td .ex,dt .ex{display:inline;margin:0;padding:0;border:0}
.ex .de{margin:0}
.tip{border-left:2px solid var(--rule-2);padding:2px 0 2px 16px;margin:16px 0;font-size:15px;color:var(--ink-2)}
.formula{font-family:var(--f-de);padding:8px 0 8px 16px;border-left:2px solid var(--rule)}
.kbd{font:12px var(--f-ui);border:1px solid var(--rule-2);border-radius:3px;padding:0 5px}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:14px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
.tbl thead th{font:500 12.5px var(--f-ui);color:var(--ink-3);border-bottom-color:var(--ink-3)}
.tbl th small{font:400 11.5px var(--f-ui);color:var(--ink-3)}
.case-tbl td{font:17px var(--f-de);text-align:center}
.case-tbl td.hot{background:var(--sheet-2);font-weight:600}
.case-tbl{max-width:520px}
.c-n{color:var(--c-n)}.c-a{color:var(--c-a)}.c-d{color:var(--c-d)}.c-g{color:var(--c-g)}.c-v{color:var(--c-v)}
.concepts dt{font:600 17px var(--f-de);margin-top:16px}
.concepts dd{margin:4px 0 0;color:var(--ink-2)}
.steps{padding-left:1.6em}
.steps>li{margin:1em 0;padding-left:.2em}
.steps>li::marker{font:15px var(--f-de);color:var(--ink-3)}
.qh{font:600 14px var(--f-ui);margin:16px 0 4px}
.qbox{margin:16px 0 6px;padding:2px 0 6px 16px;border-left:2px solid var(--rule)}
.qbox .qh{margin-top:10px;color:var(--ink)}

/* role / attachment / tree diagrams inside lessons: grammar colours are content */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin:16px 0}
.role{--c:var(--ink-3);border-top:2px solid var(--c);padding:8px 2px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.role[data-c="n"]{--c:var(--c-n)}.role[data-c="a"]{--c:var(--c-a)}.role[data-c="d"]{--c:var(--c-d)}.role[data-c="g"]{--c:var(--c-g)}.role[data-c="v"]{--c:var(--c-v)}
.role .rw{font:600 17px var(--f-de)}
.role .rq{font-size:12px;color:var(--ink-3)}
.role .rz{font:15px var(--f-zh)}
.role b{font:600 12px var(--f-ui);color:var(--c);margin-top:4px}
.attach{display:grid;gap:0;margin:14px 0;border-top:1px solid var(--rule)}
.arow{display:grid;grid-template-columns:auto auto auto;justify-content:start;align-items:center;gap:6px 10px;border-bottom:1px solid var(--rule);padding:10px 0}
.arow .alab{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.ahead{font:600 16px var(--f-de);padding:1px 6px;border:1px solid var(--rule-2);border-radius:4px}
.aarr{font-size:18px;color:var(--ink-3)}
.adep{font:600 16px var(--f-de);padding:1px 6px;border-radius:4px;color:var(--paper);background:var(--c-d)}
.adep[data-c="g"]{background:var(--c-g)}
@media (min-width:640px){.arow{grid-template-columns:auto auto auto 1fr}.arow .alab{grid-column:auto}}
.tree{margin:14px 0;font-size:14.5px;min-width:0}
.tree .tn{display:inline-block;max-width:100%;border:1px solid var(--rule-2);border-radius:4px;padding:5px 10px;font-family:var(--f-zh)}
.tree .tn b{font:600 15px var(--f-de)}
.tree .tn small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tree .tk{display:grid;gap:10px;margin:10px 0 0 14px;padding-left:14px;border-left:1px solid var(--rule-2)}
.tree .tb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative;min-width:0}
.tree .tb::before{content:"";position:absolute;left:-15px;top:16px;width:13px;border-top:1px solid var(--rule-2)}
.tree .tex{font:italic 14px/1.6 var(--f-de);color:var(--ink-2);padding-left:10px;border-left:1px dotted var(--rule-2)}
@media (min-width:720px){.tree>.tk{grid-template-columns:1fr 1.4fr;align-items:start}}

/* quiz */
.quiz{display:grid;gap:0;margin:12px 0;border-top:1px solid var(--rule)}
.qscore{font-size:13px;color:var(--ink-3);padding-top:8px}
.qi{border-bottom:1px solid var(--rule);padding:12px 0}
.qi .de{margin:0 0 8px;font-size:calc(1.08rem * var(--scale))}
.qi .w.tgt .wd{box-shadow:inset 0 -2px 0 var(--ink);font-weight:600}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{border:1px solid var(--rule-2);background:var(--paper);border-radius:6px;padding:5px 14px;cursor:pointer;font:14px var(--f-ui)}
.qopt:hover{border-color:var(--ink-3)}
.qopt[disabled]{cursor:default;opacity:.55}
.qopt.right{opacity:1;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qopt.wrong{opacity:1;color:var(--ink-3);text-decoration:line-through}
.qwhy{margin-top:8px;font:14.5px/1.85 var(--f-zh);color:var(--ink-2)}
.qwhy b{font:600 14px var(--f-ui);color:var(--ink)}
.qreset{justify-self:start;margin-top:10px}

/* ---- reader ---- */
.read-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:6px 8px}
.ptoc{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.ptoc::-webkit-scrollbar{display:none}
.pchip{flex:none;border:0;background:none;border-radius:4px;padding:3px 8px 5px;cursor:pointer;font:13px var(--f-ui);color:var(--ink-3);position:relative;overflow:hidden;min-width:34px}
.pchip:hover{color:var(--ink);background:var(--sheet-2)}
.pchip i{position:absolute;left:8px;right:8px;bottom:1px;height:1px;background:var(--ink-3);width:0;max-width:calc(100% - 16px)}
.pchip.cur{color:var(--accent)}
.pchip.cur i{background:var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tg{border:1px solid transparent;background:none;border-radius:5px;padding:3px 9px;font:13px var(--f-ui);cursor:pointer;color:var(--ink-3)}
.tg:hover{color:var(--ink);background:var(--sheet-2)}
.tg[aria-pressed="true"]{color:var(--ink);border-color:var(--rule-2)}
.tg.sq{padding:3px 8px}
.tg.play{display:inline-flex;align-items:center;gap:5px}
.tg.play svg{width:12px;height:12px}
.legend{display:none;gap:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;margin-left:6px}
.legend.on{display:flex}
.legend span::before{content:"";display:inline-block;width:12px;height:2px;margin-right:4px;vertical-align:middle;background:currentColor}
.reader{display:grid;gap:48px;padding-block:28px 96px}
@media (min-width:1024px){.reader{grid-template-columns:minmax(0,var(--measure)) minmax(280px,320px);justify-content:space-between}}
.para{margin-bottom:48px;scroll-margin-top:170px}
.para-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding-bottom:6px;margin-bottom:10px;border-bottom:1px solid var(--rule)}
.para-h h3{font:600 19px/1.45 var(--f-zh);margin:0}
.para-h .ger{font:italic 15px var(--f-de);color:var(--ink-3)}
.pg{margin-left:auto;font-size:12px;color:var(--ink-3)}
.para-h .pg{margin-left:auto;align-self:center}
/* 脉络: what was skipped between two passages */
.gap{margin:0 0 20px;padding:2px 0 2px 16px;border-left:2px solid var(--rule-2);font:14.5px/1.9 var(--f-zh);color:var(--ink-2)}
.gap p{margin:0}.gap p+p{margin-top:6px}
.gap-l{float:left;margin:3px 10px 0 0;font:500 12px var(--f-ui);color:var(--ink-3)}
.sent{position:relative;padding:14px 0 12px;border-bottom:1px solid var(--rule);scroll-margin-top:170px;min-width:0}
.sent::before{content:"";position:absolute;left:-18px;top:16px;bottom:14px;width:2px;background:transparent}
.sent.flash::before,.sent.playing::before{background:var(--accent)}
@media (max-width:720px){.sent::before{left:-12px}}
.sent-num{font:12.5px var(--f-ui);color:var(--ink-3);display:flex;gap:8px;align-items:center}
.sent.ok .sent-num::after{content:"已读懂 ✓";color:var(--ink-3)}
.de{font:400 calc(1.2rem * var(--scale))/1.8 var(--f-de);margin:4px 0 4px;overflow-wrap:break-word;hyphens:manual}
.w{cursor:pointer;border-radius:2px}
.wd{border-radius:2px;padding:0 .04em}
.w:hover .wd{background:var(--sheet-2)}
.w.same .wd{background:var(--accent-soft)}
.w.on .wd{background:var(--accent);color:var(--paper)}
.w.speaking .wd{background:var(--accent-soft)}
.w.sp .wd{letter-spacing:.16em}
.w.la .wd{font-style:italic}
.lw{cursor:pointer;border-radius:2px;text-decoration:underline dotted;text-decoration-color:var(--rule-2);text-decoration-thickness:1px;text-underline-offset:.22em}
.lw:hover{color:var(--accent);text-decoration-color:currentColor}
.lw.on{background:var(--accent);color:var(--paper);text-decoration:none}
.gl{display:none}
.de.gloss{line-height:1.25}
.de.gloss .w{display:inline-flex;flex-direction:column;vertical-align:top;margin:0 .02em .7em 0}
.de.gloss .gl{display:block;font:400 11.5px/1.25 var(--f-ui);color:var(--ink-3);max-width:7.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;letter-spacing:0}
.de.color .w[data-v="1"] .wd{color:var(--c-v);font-weight:600}
.de.color .w[data-v="2"] .wd{color:var(--c-v)}
.de.color .w[data-c="n"] .wd{box-shadow:inset 0 -2px 0 var(--c-n)}
.de.color .w[data-c="a"] .wd{box-shadow:inset 0 -2px 0 var(--c-a)}
.de.color .w[data-c="d"] .wd{box-shadow:inset 0 -2px 0 var(--c-d)}
.de.color .w[data-c="g"] .wd{box-shadow:inset 0 -2px 0 var(--c-g)}
.de.color .w.on .wd{color:var(--paper)}
.zh{font:calc(1rem * var(--scale))/1.95 var(--f-zh);color:var(--ink-2);margin:6px 0 4px}
.notes{margin:8px 0 4px;padding:0 0 0 1.4em;font:14.5px/1.9 var(--f-zh);color:var(--ink-2)}
.notes li{margin:.3em 0}
.notes li::marker{font:12px var(--f-ui);color:var(--ink-3)}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;margin-left:-8px}
.act{display:inline-flex;align-items:center;gap:5px;border:0;background:none;border-radius:5px;padding:4px 8px;font:12.5px var(--f-ui);cursor:pointer;color:var(--ink-3)}
.act:hover{color:var(--ink);background:var(--sheet-2)}
.act[aria-pressed="true"]{color:var(--ink)}
.act svg{width:13px;height:13px}
.act .c{font-size:11px;opacity:.7}
.act.rep{color:var(--ink-3)}
/* chapters of a long book */
.chlist{display:grid;margin-bottom:56px;scroll-margin-top:90px;max-width:calc(var(--measure) + 4rem)}
.chlist-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.chlist-h h2{font:600 13px/1.3 var(--f-ui);letter-spacing:.04em;color:var(--ink-2);margin:0}
.chlist-h small{font-size:12.5px;color:var(--ink-3)}
.ch-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2.4rem 1fr auto;gap:2px 14px;align-items:baseline;width:100%;border-bottom:1px solid var(--rule);padding:14px 0;cursor:pointer;min-width:0}
.ch-row:hover .ch-t b{color:var(--accent)}
.ch-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ch-row.planned{cursor:default}
.ch-row.planned .ch-t b{color:var(--ink-3)}
.ch-n{font:400 15px var(--f-de);color:var(--ink-3);grid-row:span 2}
.ch-row.done .ch-n{color:var(--ink)}
.ch-t{min-width:0}
.ch-t b{font:600 16px/1.5 var(--f-zh);display:block}
.ch-t i{font:italic 14px var(--f-de);color:var(--ink-3)}
.ch-b{grid-column:2/4;font:14px/1.85 var(--f-zh);color:var(--ink-2)}
.ch-s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;text-align:right;display:grid;gap:6px;justify-items:end}
.ch-s .bar{display:block;width:56px;height:2px;background:var(--rule);overflow:hidden}
.ch-s .bar i{display:block;height:100%;width:var(--p);background:var(--ink-2)}
.chbar{display:flex;align-items:center;gap:6px;margin-bottom:4px;min-width:0}
.chbar .ch-cur{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden;font-size:14px}
.chbar .ch-cur b{font:600 14px var(--f-ui);overflow:hidden;text-overflow:ellipsis}
.chbar .ch-cur span{font-size:12.5px;color:var(--accent);flex:none}
.chbar .ch-cur em{font:italic 13px var(--f-de);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.chbar .ch-cur:focus-visible{outline:2px solid var(--accent);border-radius:2px}
.chbar .tg{flex:none}
@media (max-width:480px){.chbar .ch-cur em{display:none}}
.chnext{display:grid;margin:8px 0 48px;border-top:1px solid var(--rule)}
.chnext .lab{font-size:12.5px;color:var(--ink-3);padding-top:12px}

/* ---- word slip (sidebar on desktop, bottom sheet on phones) ---- */
.slip-col{display:none}
@media (min-width:1024px){.slip-col{display:block}.slip-col .slip{position:sticky;top:180px;max-height:calc(100vh - 200px);overflow:auto}}
.slip{padding:0 0 0 24px;border-left:1px solid var(--rule)}
.slip-empty{color:var(--ink-3);font:14px/1.8 var(--f-zh)}
.slip-empty .frak{display:none}
.sl-top{display:flex;align-items:flex-start;gap:6px}
.sl-word{font:600 26px/1.2 var(--f-de);margin:0;word-break:break-word;flex:1;min-width:0}
.sl-lemma{font:15px var(--f-de);color:var(--ink-2);margin-top:4px}
.sl-lemma b{font-weight:600;color:var(--ink)}
.sl-back{display:inline-flex;align-items:center;gap:4px;font:12.5px var(--f-ui);color:var(--ink-3);background:none;border:0;padding:2px 0;margin-bottom:8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-back:hover{color:var(--ink)}
.sl-src{font:12px var(--f-ui);color:var(--ink-3);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px 10px;margin:10px 0 6px}
.chip{font:12.5px/1.4 var(--f-ui);color:var(--ink-2)}
.chip+.chip::before{content:"·";margin-right:10px;color:var(--rule-2)}
.chip.verb{color:var(--c-v)}
.chip.here{font-weight:600}
.chip.here.n{color:var(--c-n)}.chip.here.a{color:var(--c-a)}.chip.here.d{color:var(--c-d)}.chip.here.g{color:var(--c-g)}
.sl-gram{font-size:13.5px;color:var(--ink-2)}
.sl-mean{font:600 19px/1.6 var(--f-zh);margin:10px 0 6px}
.sl-note{font:14.5px/1.9 var(--f-zh);color:var(--ink);margin:6px 0 0}
.sl-why{margin-top:14px;padding:0 0 0 14px;font:14px/1.85 var(--f-zh);border-left:2px solid var(--rule-2);color:var(--ink-2)}
.sl-why[data-c="n"]{border-color:var(--c-n)}.sl-why[data-c="a"]{border-color:var(--c-a)}.sl-why[data-c="d"]{border-color:var(--c-d)}.sl-why[data-c="g"]{border-color:var(--c-g)}
.sl-why h4{font:600 13px var(--f-ui);margin:0 0 2px;color:var(--ink)}
.sl-why i{font-weight:600}
.sl-sec{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px}
.sl-sec h4{font:500 12px var(--f-ui);letter-spacing:.04em;color:var(--ink-3);margin:0 0 8px}
.mini{border-collapse:collapse;font:14px var(--f-de);width:100%}
.mini th{font:500 11px var(--f-ui);color:var(--ink-3);padding:3px;text-align:center}
.mini td{text-align:center;padding:4px 2px;border-bottom:1px solid var(--rule)}
.mini td.hit{color:var(--accent);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.forms{display:flex;flex-wrap:wrap;gap:2px 10px}
.form-b{border:0;background:none;padding:1px 0;font:14px var(--f-de);cursor:pointer;color:var(--accent)}
.form-b:hover{text-decoration:underline;text-underline-offset:.2em}
.occ{display:flex;flex-wrap:wrap;gap:2px 10px}
.occ button{border:0;background:none;padding:1px 0;font:12.5px var(--f-ui);cursor:pointer;color:var(--accent)}
.occ button:hover{text-decoration:underline;text-underline-offset:.2em}
.sl-report{display:block;margin-top:18px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:72vh;overflow:auto;border-top:1px solid var(--rule-2);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;background:var(--paper)}
.sheet.open{transform:none;visibility:visible}
.sheet .grab{width:36px;height:3px;border-radius:2px;background:var(--rule-2);margin:2px auto 12px}
.sheet .slip{border:0;padding:0}
@media (min-width:1024px){.sheet{left:auto;right:24px;bottom:24px;width:360px;border:1px solid var(--rule-2);border-radius:8px;padding-top:18px}.sheet .grab{display:none}.slip-col .sheet-x{display:none}}

/* ---- vocab ---- */
.vtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.search{flex:1 1 240px;min-width:0;border:0;border-bottom:1px solid var(--rule-2);background:none;border-radius:0;padding:8px 2px;font:16px var(--f-ui);color:var(--ink)}
.search:focus{outline:none;border-bottom-color:var(--accent)}
.vlist{border-top:1px solid var(--rule);margin-bottom:72px}
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.vrow:hover .f{color:var(--accent)}
.vrow .f{font:600 16px var(--f-de);overflow-wrap:anywhere}
.vrow .f small{display:block;font:400 12.5px var(--f-de);color:var(--ink-3)}
.vrow .m{font:14.5px/1.8 var(--f-zh);color:var(--ink-2)}
.vrow .q{font-size:12px;color:var(--ink-3);text-align:right;white-space:nowrap}
.more{margin:18px auto 0;display:block}

/* ---- saved / cards ---- */
.card-wrap{max-width:560px;margin:8px 0 72px}
.fcard{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);min-height:240px;padding:28px 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;gap:6px}
.fcard .fw{font:600 32px/1.2 var(--f-de);overflow-wrap:anywhere}
.fcard .fl{font:15px var(--f-de);color:var(--ink-3)}
.fcard .fm{font:600 19px/1.6 var(--f-zh);margin-top:12px}
.fcard .fh{font-size:12.5px;color:var(--ink-3);margin-top:14px}
.fnav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.fnav span{font-size:13px;color:var(--ink-3)}
.empty{border-left:2px solid var(--rule-2);padding:4px 0 4px 18px;color:var(--ink-2);max-width:var(--measure);font:15px/1.9 var(--f-zh)}
.empty h3{font:600 17px var(--f-zh);margin:0 0 6px;color:var(--ink)}

/* ---- read-aloud player, toast, feedback ---- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--rule-2);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
@media (min-width:1024px){.player{left:24px;right:auto;bottom:24px;width:440px;border:1px solid var(--rule-2);border-radius:8px}}
.pl-info{display:flex;gap:10px;align-items:baseline;min-width:0}
.pl-lab{font-size:12.5px;color:var(--accent);white-space:nowrap}
.pl-zh{font:14px/1.6 var(--f-zh);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.pl-btns{display:flex;align-items:center;gap:4px}
.pl-btns button{border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2);border-radius:6px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:13px var(--f-ui)}
.pl-btns button svg{width:15px;height:15px}
.pl-btns .pl-main{background:var(--ink);border-color:var(--ink);color:var(--paper);min-width:48px}
.pl-btns [aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3)}
.pl-btns .pl-x{margin-left:auto}
body.playing main,body.playing footer{padding-bottom:110px}
body.loading main{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none}
.toast.on{opacity:1}
.fb-line{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.fb-line button,.sl-report,.l-report{background:none;border:0;padding:0;color:var(--ink-3);font:13px var(--f-ui);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.fb-line button:hover,.sl-report:hover,.l-report:hover{color:var(--accent);text-decoration-color:currentColor}
.l-report{margin-left:auto}
dialog.fb{border:1px solid var(--rule-2);border-radius:8px;background:var(--paper);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog.fb::backdrop{background:rgba(0,0,0,.3)}
.fb h3{margin:0 0 4px;font:600 17px var(--f-ui)}
.fb .fb-where{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.fb label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
.fb textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule-2);border-radius:6px;background:var(--paper);color:var(--ink);padding:8px 10px;font:14px/1.6 var(--f-ui);resize:vertical}
.fb textarea:focus{outline:none;border-color:var(--accent)}
.fb textarea[readonly]{color:var(--ink-2);font-family:var(--f-de);background:var(--sheet-2)}
.fb .fb-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fb .fb-hint{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.6}
footer{border-top:1px solid var(--rule);padding-block:22px 44px;color:var(--ink-3);font-size:13px}
.fz{display:inline-flex;gap:0}

<script>
const LIB = /*@LIB@*/;

(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]!=null?o[k]:'');
const mkStore=ns=>({get(k,d){try{const v=localStorage.getItem(ns+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(ns+k,JSON.stringify(v))}catch(e){}}});
const ICON={
  back:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  say:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>',
  zh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c-1 4-4 7-7 8"/><path d="m13 20 4-9 4 9M14.5 17h5"/></svg>',
  gram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* ---------- library index ---------- */
const BOOKS={}, COURSES={};
LIB.books.forEach(b=>BOOKS[b.id]=b); LIB.courses.forEach(c=>COURSES[c.id]=c);
/* Data arrives in pieces: the shelf (this page) is inline; each book's text + lexicon and the shared
   dictionary are separate JSON files fetched on first use (or inlined in LIB.data for one-file builds). */
const LOADS={};
function load(name){
  if(LOADS[name]) return LOADS[name];
  const inl=LIB.data&&LIB.data[name];
  return LOADS[name]=inl?Promise.resolve(inl):fetch('data/'+name+'.json?v='+LIB.v).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(e=>{ delete LOADS[name]; throw e; });
}
async function ensureBook(id){ const b=BOOKS[id]; if(!b.lex) Object.assign(b, await load(id)); return b; }
/* A long book is split into chapters (BOOKS[id].chapters). The lexicon, lessons and a word → chapters index
   come with the book; each chapter's text is its own file, fetched when the chapter is opened. Sentence ids
   carry the chapter: "<chapter>-<part>-<sentence>"; books without chapters keep "<part>-<sentence>". */
const isCh=id=>!!(BOOKS[id]&&BOOKS[id].chapters);
const liveChs=id=>BOOKS[id].chapters.filter(c=>!c.planned);
const chOf=(id,cid)=>BOOKS[id].chapters.find(c=>c.id===cid);
async function ensureChapter(id,cid){ const b=BOOKS[id]; b.chText=b.chText||{}; if(!b.chText[cid]) b.chText[cid]=(await load(id+'.'+cid)).text; return b.chText[cid]; }
function sentIds(id){ const b=BOOKS[id], out=[]; const add=(pre,toc)=>toc.forEach((t,pi)=>{ for(let si=0;si<t[1];si++) out.push(pre+pi+'-'+si); });
  if(b.chapters) liveChs(id).forEach(c=>add(c.id+'-',c.toc)); else add('',b.toc); return out; }
const SIDRE=/^(?:([a-z0-9]+)-)?(\d+)-(\d+)$/;
function sidLabel(id,sid){ const b=BOOKS[id], m=SIDRE.exec(sid); if(!m) return ''; let toc=b.toc, pre='';
  if(b.chapters){ const c=m[1]&&chOf(id,m[1]); if(!c||!c.toc) return ''; toc=c.toc; pre=c.n+'·'; }
  const t=toc&&toc[+m[2]]; return t?pre+sentLabel(t[0],+m[3],t[1]):''; }
function occIndex(b){ if(!b.occ) return null; if(b.OCCX) return b.OCCX; const o={}, f={};
  for(const k in b.occ){ o[k]=b.occ[k].split(',').map(x=>{ const [c,n,sid]=x.split(':'); return [c,+n,sid]; }); f[k]=o[k].reduce((a,x)=>a+x[1],0); }
  b.FREQ=f; return b.OCCX=o; }
function defaultCh(id){ const live=liveChs(id), last=mkStore('reader.'+id+'.').get('ch',null);
  if(last && live.some(c=>c.id===last)) return last;
  const ok=new Set(mkStore('reader.'+id+'.').get('ok',[])), nx=sentIds(id).find(x=>!ok.has(x));
  return nx?SIDRE.exec(nx)[1]:live[0].id; }
let DICT=null;
const DEFPROF=LIB.profiles[Object.keys(LIB.profiles)[0]];
const PX=()=>C?C.P:DEFPROF;
function sentLabel(k,si,n){ return /^\w+$/.test(k)?k+'.'+(si+1):(n>1?k+' '+(si+1):k); }
const UI=mkStore('reader.ui.');
// carry progress over from older single-book versions of this page
LIB.books.forEach(b=>{ const leg=b.meta&&b.meta.legacyStorage; if(!leg) return; try{
  for(const k of ['ok','saved']){ const o=localStorage.getItem(leg+k); const nk='reader.'+b.id+'.'+k; if(o!=null && localStorage.getItem(nk)==null) localStorage.setItem(nk,o); }
  for(const k of ['gloss','color','zhAll','scale']){ const o=localStorage.getItem('reader.'+b.id+'.'+k)??localStorage.getItem(leg+k); if(o!=null && localStorage.getItem('reader.ui.'+k)==null) localStorage.setItem('reader.ui.'+k,o); }
}catch(e){} });

const PREP={};
function prep(bookId,cid){
  cid=cid||null; const key=bookId+(cid?'|'+cid:'');
  if(PREP[key]) return PREP[key];
  const b=BOOKS[bookId], P=LIB.profiles[b.meta.profile];

function renderDe(de, sid){
  let out='';

    if(!part) continue;
    let cls='', t=part;
    if(/^\*.*\*$/.test(part)){cls=' sp'; t=part.slice(1,-1);}
    else if(/^_.*_$/.test(part)){cls=' la'; t=part.slice(1,-1);}
    else if(/^<<.*>>$/.test(part)){cls=' tgt'; t=part.slice(2,-2);}
    let last=0, m; const re=new RegExp(C.TOK.source,'g');
    while((m=re.exec(t))){
      out+=esc(t.slice(last,m.index));
      const r=resolve(m[2],m[3]); const pos=r.d?r.d[1]:''; const v=pos?verbFlag(pos):'';
      out+=esc(m[1])+'<span class="w'+cls+'" tabindex="0" role="button" data-w="'+esc(m[2])+'" data-k="'+esc(m[3]||'')+'" data-id="'+esc(r.id||'')+'"'+(pos?' data-pos="'+pos+'"':'')+(v?' data-v="'+v+'"':'')+(r.cs?' data-c="'+r.cs[0]+'"':'')+(sid?' data-s="'+sid+'"':'')+'><span class="wd">'+esc(m[2])+esc(m[4])+'</span><span class="gl">'+esc(gloss(r))+'</span></span>';

/* ---------- word slip ---------- */
function tableFor(r){
  if(!r.cs||!r.d) return null; const lem=r.d[0];
  for(const t of C.P.tables){
    const w=t.when; let ok=true, stem='';
    if(w.named && !w.named.includes(r.named)) ok=false;
    if(w.lemma && !w.lemma.includes(lem)) ok=false;
    if(w.lemmaStem){ if(lem in w.lemmaStem) stem=w.lemmaStem[lem]; else ok=false; }
    if(w.surface && (!w.surface.includes(r.w) || r.named)) ok=false;
    if(!ok) continue;
    const ov=(t.override&&t.override[lem])||{};
    return {name:t.name, cell:(c,g)=>ov[c+'.'+g]!=null?ov[c+'.'+g]:(t.full?t.full[c][g]:stem+t.endings[c][g])};
  }
  return null;
}
function caseTable(r){
  const t=tableFor(r); if(!t) return ''; const P=C.P;
  return '<div class="sl-sec"><h4>'+esc(t.name)+' · 变格表（高亮 = 此处）</h4><div class="scroll"><table class="mini"><tr><th></th>'+P.genderOrder.map(g=>'<th>'+P.genders[g]+'</th>').join('')+'</tr>'+P.caseOrder.map(c=>'<tr><th class="'+P.cases[c].css+'">'+P.cases[c].name+'</th>'+P.genderOrder.map(g=>'<td'+(r.cs===c+g?' class="hit"':'')+'>'+esc(t.cell(c,g))+'</td>').join('')+'</tr>').join('')+'</table></div></div>';
}
function whyCase(r, el){
  if(!r.cs || !el) return '';
  const P=C.P, c=r.cs[0], cname=P.cases[c].name, R=P.reasons;
  let msg=r.named==='rel'?R.rel+' ':'';
  const de=el.closest('.de'); const ws=de?[...de.querySelectorAll('.w')]:[]; const i=ws.indexOf(el);
  const prev=i>0?ws[i-1]:null; const pw=prev?prev.dataset.w:''; const gov=prev?P.governors[pw.toLowerCase()]:null;
  if(r.named!=='rel'){
    if(gov && gov.includes(c)) msg+= gov==='ad'? fmt(R.prepTwo,{p:'<i>'+esc(pw)+'</i>',case:cname,sense:R.senses[c]}) : fmt(R.prep,{p:'<i>'+esc(pw)+'</i>',case:cname});
    else if(c==='g' && prev && prev.dataset.pos==='N') msg+=fmt(R.afterNoun,{p:'<i>'+esc(pw)+'</i>'});
    else msg+=R.default[c];
  }
  return '<div class="sl-why" data-c="'+c+'"><h4>'+fmt(R.title,{case:cname})+'</h4>'+msg+'</div>';
}
function slipHtml(r, surface, sid, el){
  const back=SLIP.hist.length?'<button class="sl-back" data-slipback>'+ICON.back+'<span lang="de">'+esc(SLIP.hist[SLIP.hist.length-1].surface)+'</span></button>':'';
  if(!r.d) return back+'<p class="slip-empty">这个词暂无释义。</p>';
  const P=PX(), [lemma,pos,gram,mean,note]=r.d, saved=!!S&&S.saved.includes(r.id);
  let h=back+'<div class="sl-top"><h3 class="sl-word" lang="'+P.lang+'">'+esc(surface)+'</h3><button class="icon-btn" data-sw="'+esc(surface)+'" aria-label="朗读" title="朗读">'+ICON.say+'</button>'+(S?'<button class="icon-btn" data-star="'+esc(r.id)+'" aria-pressed="'+saved+'" aria-label="收藏到生词本" title="收藏到生词本">'+(saved?ICON.starOn:ICON.star)+'</button>':'')+'<button class="icon-btn sheet-x" aria-label="关闭">'+ICON.x+'</button></div>';
  if(lemma.toLowerCase()!==surface.toLowerCase()) h+='<div class="sl-lemma">原形 <b lang="'+P.lang+'">'+esc(lemma)+'</b></div>';
  h+='<div class="chips"><span class="chip'+(verbFlag(pos)?' verb':'')+'">'+esc(P.pos[pos]||pos)+'</span>'+(r.cs?'<span class="chip here '+r.cs[0]+'">此处：'+caseText(r.cs)+'</span>':'')+'</div>';
  h+='<div class="sl-gram">'+esc(gram)+'</div><div class="sl-mean">'+esc(mean)+'</div>';

  const rep=LIB.site.repo?'<button class="sl-report" data-report="word">这个词条有错？报告</button>':'';
  const hw=lemma.replace(/^(der|die|das|sich)\s+/,'').split(/[\s(（,，;；]/)[0];
  if(/^[A-Za-zÄÖÜäöüßẞ-]+$/.test(hw)) h+='<button class="sl-wb" data-route="wb/'+esc(encodeURIComponent(hw))+'">在德英词典里查 <span lang="de">'+esc(hw)+'</span>：全部变形与例句 →</button>';

  if(forms.length) h+='<div class="sl-sec"><h4>同一个词在文中的其他形式</h4><div class="forms">'+forms.map(id=>'<button class="form-b" data-open="'+esc(id)+'" lang="'+P.lang+'">'+esc(id)+'</button>').join('')+'</div></div>';
  const occ=C.OCC[r.id]||[];
  const where=C.kind==='course'?'在《'+esc(BOOKS[C.textBook].meta.short||BOOKS[C.textBook].meta.title)+'》中':C.ch?'在本章':'在文中';
  if(occ.length) h+='<div class="sl-sec"><h4>'+where+'出现 '+occ.length+' 次（同一用法）</h4><div class="occ">'+occ.slice(0,40).map(id=>{const x=C.SENTS.find(z=>z.id===id);return '<button data-jump="'+id+'"'+(id===sid?' aria-current="true"':'')+'>§ '+esc(x.label)+'</button>'}).join('')+'</div></div>';
  // where else the word occurs in a chaptered book (for a course: in the reader its examples come from)
  const tb=C.textBook, others=C.OCCX&&C.OCCX[r.id]?C.OCCX[r.id].filter(o=>o[0]!==C.cid&&chOf(tb,o[0])):[];
  if(others.length) h+='<div class="sl-sec"><h4>'+(C.kind==='course'?'在《'+esc(BOOKS[tb].meta.short||BOOKS[tb].meta.title)+'》中':C.ch?'在其他章节':'在书中')+'出现</h4><div class="occ">'+others.map(o=>'<button data-route="'+esc(tb)+'~s-'+esc(o[2])+'">第 '+esc(chOf(tb,o[0]).n)+' 章 × '+o[1]+'</button>').join('')+'</div></div>';
  return h+rep;
}

/* ---------- listen to the whole text ----------
   Reads sentence by sentence with the device's German voice, highlighting the sentence (and the word, where
   the voice reports word boundaries), scrolling along and showing the translation. Long sentences are cut at
   punctuation, because some browsers stop a single utterance after ~15 seconds. Pausing = stopping and
   restarting the current piece, which works the same on every browser. Keeps the screen awake while playing. */
const PICON={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>'};
const RATES=[.7,.85,1,1.15];

$('#plPrev').innerHTML=PICON.prev; $('#plNext').innerHTML=PICON.next; $('#plX').innerHTML=ICON.x; $('#tgPlay').insertAdjacentHTML('afterbegin',PICON.play);
function chunksOf(t){
  const out=[]; let base=0;
  while(t.length-base>220){ const seg=t.slice(base,base+220); let cut=Math.max(seg.lastIndexOf(', '),seg.lastIndexOf('; '),seg.lastIndexOf(': ')); if(cut<60) cut=seg.lastIndexOf(' '); if(cut<1) cut=219; out.push({t:t.slice(base,base+cut+1),base}); base+=cut+1; }
  out.push({t:t.slice(base),base}); return out.filter(c=>c.t.trim());
}
function plUi(){
  const x=C&&C.SENTS[PL.i]; if(!x) return;
  $('#plLab').textContent='§ '+x.label+' · '+(PL.i+1)+' / '+C.SENTS.length;
  $('#plZh').textContent=x.s.zh; $('#plZh').hidden=!PL.zh; $('#plZhBtn').setAttribute('aria-pressed',PL.zh);
  $('#plMain').innerHTML=PL.paused?PICON.play:PICON.pause; $('#plMain').setAttribute('aria-label',PL.paused?'继续':'暂停');

}
function plMark(){

}
function plWord(idx){

}
function plSpeak(ci){
  const tok=++PL.token; try{ speechSynthesis.cancel(); }catch(e){}
  const ch=PL.chunks[ci]; PL.ci=ci;
  if(!ch){ if(PL.i<C.SENTS.length-1){ setTimeout(()=>{ if(tok===PL.token&&PL.on&&!PL.paused){ PL.i++; plSentence(); } },380); } else plStop(C.ch?'本章读完了':'全文读完了'); return; }
  const {tts,v}=germanVoice(), u=new SpeechSynthesisUtterance(ch.t); u.lang=tts; if(v) u.voice=v; u.rate=PL.rate;

function firstVisibleSent(){ const top=$('.read-tools').getBoundingClientRect().bottom; const arts=$$('#text .sent'); const a=arts.find(a=>a.getBoundingClientRect().bottom>top+40)||arts[0]; return a?C.SENTS.findIndex(x=>'s-'+x.id===a.id):0; }

  navigator.mediaSession.setActionHandler('previoustrack',()=>plGo(-1)); navigator.mediaSession.setActionHandler('nexttrack',()=>plGo(1)); }catch(e){} }

/* ---------- navigation ----------
   Routes are plain hash tokens:  lib  ·  <book>~home|intro|read|vocab|saved  ·  <book>~s-1-0 (one sentence)
   ·  chaptered books: <book>~toc (table of contents) · <book>~ch-<chapter> · <book>~s-<chapter>-1-0
   ·  <book>~intro-2 (lesson 2)  ·  <course>~intro  ·  <course>~intro-3.
   An in-page stack drives the ← back button, because the app viewer shows no browser chrome.
   When the frame allows it, each step is mirrored into history.pushState, so the browser's back button,
   Android's back key and iOS swipe-back follow the same path. An open word sheet on a phone is its own
   history step, so back closes the sheet before it leaves the page you are on. */
const SUBS=['home','intro','read','vocab','saved'];
const VIEWNAME={lib:'书架',home:'导读',intro:'课程',read:'精读',vocab:'词汇表',saved:'生词本'};
const NAV={stack:[], cur:null, shown:null, hist:true, sheetEntry:false, popSeen:0};
const viewY={};
function parse(t){
  if(!t||t==='lib') return {ctx:null, sub:'lib'};
  if(t==='wb'||t.startsWith('wb/')){ let w=''; try{ w=decodeURIComponent(t.slice(3)); }catch(e){ w=t.slice(3); } return {ctx:null, sub:'wb', w}; }
  const i=t.indexOf('~');
  if(i<0) return /^(home|intro|read|vocab|saved|s-\d+-\d+|intro-\d+)$/.test(t)?{ctx:LIB.default, sub:t}:null;   // links from the single-book version
  return {ctx:t.slice(0,i), sub:t.slice(i+1)};
}
const canon=t=>{ const r=parse(t); if(r&&r.sub==='wb') return r.w?'wb/'+encodeURIComponent(r.w):'wb'; return !r?'lib':(r.ctx?r.ctx+'~'+r.sub:'lib'); };
function validRoute(t){
  const r=parse(t); if(!r) return false; if(r.sub==='lib'||r.sub==='wb') return true;
  if(!usable(r.ctx)) return false;
  const isCourse=!!COURSES[r.ctx];
  if(isCourse) { if(r.sub==='intro') return true; const m=/^intro-(\d+)$/.exec(r.sub); return !!m && +m[1]>=1 && +m[1]<=(COURSES[r.ctx].lessons||[]).length; }
  if(SUBS.includes(r.sub)) return true;
  const b=BOOKS[r.ctx];
  if(r.sub==='toc') return !!b.chapters;
  let m=/^ch-([a-z0-9]+)$/.exec(r.sub); if(m) return !!b.chapters && liveChs(r.ctx).some(c=>c.id===m[1]);
  m=/^s-(.+)$/.exec(r.sub); if(m){ const k=SIDRE.exec(m[1]); if(!k || !!k[1]!==!!b.chapters) return false;
    const toc=b.chapters?(chOf(r.ctx,k[1])||{}).toc:b.toc, t=toc&&toc[+k[2]]; return !!t && +k[3]<t[1]; }
  m=/^intro-(\d+)$/.exec(r.sub); if(m) return +m[1]>=1 && +m[1]<=BOOKS[r.ctx].nLessons;
  return false;
}
const viewOfSub=s=>/^(s|ch)-/.test(s)?'read':/^intro-/.test(s)?'intro':s==='toc'?'home':s;
const viewKey=t=>{ const r=parse(t); if(r.sub==='wb') return canon(t); return r.ctx?r.ctx+'~'+viewOfSub(r.sub):'lib'; };
function ctxTitle(id){ const m=BOOKS[id]?BOOKS[id].meta:COURSES[id].meta; return m.short||m.title; }
function routeLabel(t){
  const r=parse(t); if(r.sub==='lib') return '书架'; if(r.sub==='wb') return r.w?r.w:'词典';
  let lab=/^s-/.test(r.sub)?'§ '+sidLabel(COURSES[r.ctx]?COURSES[r.ctx].meta.lexiconFrom:r.ctx, r.sub.slice(2))
         :/^ch-/.test(r.sub)?'第 '+((chOf(r.ctx,r.sub.slice(3))||{}).n||'')+' 章'
         :r.sub==='toc'?'目录'
         :/^intro-/.test(r.sub)?'第 '+r.sub.slice(6)+' 课':(COURSES[r.ctx]?'':VIEWNAME[r.sub]);
  if(!C || C.id!==r.ctx || COURSES[r.ctx]) lab=ctxTitle(r.ctx)+(lab?' · '+lab:'');
  return lab;
}
function showView(v){
  if(v!=='read' && typeof PL!=='undefined') plStop();
  ['lib',...SUBS,'wb'].forEach(x=>{ $('#v-'+x).hidden = x!==v; });
  $('#wbBtn').setAttribute('aria-current', v==='wb'?'page':'false');
  $$('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.go===v));
  if(v==='vocab') renderVocab(); if(v==='saved') renderSaved(); if(v==='lib') renderLibrary();
  if(v==='home' && C){ renderChapterList(); updateCont(); }
}
let renderSeq=0;
async function render(t, y){
  const seq=++renderSeq;
  const r=parse(t), v=r.ctx?viewOfSub(r.sub):(r.sub==='wb'?'wb':'lib');
  let cid=null;
  if(r.ctx && isCh(r.ctx)){
    const m=/^ch-([a-z0-9]+)$/.exec(r.sub)||/^s-([a-z0-9]+)-\d+-\d+$/.exec(r.sub);
    cid=m?m[1]:v==='read'?defaultCh(r.ctx):(C&&C.id===r.ctx?C.cid:null);
  }
  // the reading position is remembered per chapter
  const key=viewKey(t)+(v==='read'&&cid?'@'+cid:''), same=NAV.shown===key;
  if(NAV.shown && !same) viewY[NAV.shown]=scrollY;
  if(r.ctx){
    const need=COURSES[r.ctx]?COURSES[r.ctx].meta.lexiconFrom:r.ctx;
    if(!BOOKS[need].lex || (cid && !(BOOKS[need].chText||{})[cid])){
      document.body.classList.add('loading');
      try{ await ensureBook(need); if(cid) await ensureChapter(need,cid); }catch(e){ document.body.classList.remove('loading'); toast('加载失败，请检查网络后重试'); return; }
      document.body.classList.remove('loading');

  } else leaveCtx();
  showView(v); NAV.shown=key;
  if(v==='wb') wbShow(r.w);
  const run=()=>{
    if(y!=null) window.scrollTo(0,y);
    else if(/^s-/.test(r.sub)) jump(r.sub.slice(2), same);
    else if(/^intro-/.test(r.sub)) openLesson(+r.sub.slice(6)-1);
    else if(/^ch-/.test(r.sub)||v==='read'){ if(same) window.scrollTo(0,scrollY); else if(viewY[key]!=null) window.scrollTo(0,viewY[key]); else if(!restorePos(cid)) window.scrollTo(0,0); }
    else if(r.sub==='toc'){ const el=$('#chlist'); if(el && !el.hidden) el.scrollIntoView({block:'start'}); }
    else window.scrollTo(0, viewY[key]||0);

  requestAnimationFrame(()=>requestAnimationFrame(run));
}
function histWrite(state, replace){
  if(!NAV.hist) return;
  try{ replace? history.replaceState(state,'','#'+state.t) : history.pushState(state,'','#'+state.t); }catch(e){ NAV.hist=false; }
}
function navigate(t, opts={}){
  t=canon(t); if(!validRoute(t)) t='lib';
  const r=parse(t);
  if((r.sub==='lib'||SUBS.includes(r.sub)) && NAV.cur && viewKey(NAV.cur)===viewKey(t)){ closeSheet(); window.scrollTo({top:0}); return; }
  const fromSheet=NAV.sheetEntry; NAV.sheetEntry=false; hideSheet();
  if(NAV.cur && !opts.replace) NAV.stack.push({t:NAV.cur, y:scrollY});
  NAV.cur=t; render(t);
  histWrite({t, i:NAV.stack.length}, opts.replace||fromSheet);
  updateBack();
}
function popTo(n, forceY){
  let e=null; while(NAV.stack.length>n) e=NAV.stack.pop();
  if(!e) return;
  NAV.cur=e.t; render(e.t, forceY!=null?forceY:e.y); updateBack();
}
function goBack(){
  if(sheetOpen()){ closeSheet(); return; }
  if(!NAV.stack.length) return;
  if(NAV.hist){
    const seen=NAV.popSeen, target=NAV.stack.length-1;
    try{ history.back(); }catch(e){ NAV.hist=false; }
    setTimeout(()=>{ if(NAV.popSeen===seen && NAV.stack.length>target){ NAV.hist=false; popTo(target); } },350);
    if(NAV.hist) return;
  }
  popTo(NAV.stack.length-1);
}
window.addEventListener('popstate',e=>{
  NAV.popSeen++;
  const st=e.state;
  if(NAV.sheetEntry){ NAV.sheetEntry=false; hideSheet(); if(st && !st.sheet && st.i===NAV.stack.length) return; }
  if(!st || st.t==null){ const h=canon((location.hash||'').slice(1)); if(validRoute(h) && h!==NAV.cur) navigate(h); return; }
  if(st.sheet) return;
  if(st.i < NAV.stack.length) popTo(st.i);
  else if(st.i > NAV.stack.length){ NAV.stack.push({t:NAV.cur, y:scrollY}); NAV.cur=st.t; render(st.t); updateBack(); }
  else if(st.t!==NAV.cur){ NAV.cur=st.t; render(st.t); updateBack(); }
});
function updateBack(){
  const b=$('#backBtn'); const top=NAV.stack[NAV.stack.length-1];
  b.hidden=!top; document.body.classList.toggle('has-back',!!top);
  if(top){ const l=routeLabel(top.t); $('#backLbl').textContent=l; b.setAttribute('aria-label','返回'+l); }
}
$('#backBtn').addEventListener('click',goBack);
try{ history.scrollRestoration='manual'; }catch(e){}
