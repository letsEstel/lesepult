<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fontsHref}}">
<style>
/* Layout: a reading desk. Masthead in the book's display face; the text column on the left, a sticky word slip on the right (bottom sheet on phones). Accent ink on cool paper. Book-specific fonts and accent come from book.json (see the second :root block). */
:root{
  --paper:#f3f4f1; --sheet:#fbfbf9; --sheet-2:#eef0ec; --ink:#191d25; --ink-2:#454c5a; --ink-3:#757c8a;
  --rule:#d8dbd3; --rule-2:#c6cac0; --prussian:#1e3c6a; --prussian-2:#2c5590; --prussian-soft:#e2e8f1; --wax:#9e3d27;
  --c-n:#2d5a9b; --c-a:#b1462c; --c-d:#2a7a57; --c-g:#986810; --c-v:#6b3a8c;
  --hl:#f2e7b9; --ok:#2a7a57; --bad:#b1462c; --shadow:0 1px 2px rgba(25,29,37,.06),0 8px 24px rgba(25,29,37,.07);
  --f-de:Georgia,"Times New Roman",serif;
  --f-frak:Georgia,serif;
  --f-zh:"Songti SC","STSong","SimSun",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --paper:#111419; --sheet:#171b21; --sheet-2:#1e232b; --ink:#e5e7eb; --ink-2:#b3b9c4; --ink-3:#848b98;
  --rule:#2a3039; --rule-2:#38404b; --prussian:#94b4e6; --prussian-2:#b3caee; --prussian-soft:#1d2a3f; --wax:#e38b6f;
  --c-n:#86aef0; --c-a:#f08f73; --c-d:#6fd0a2; --c-g:#e2b75a; --c-v:#c9a0ea;
  --hl:#4a4224; --ok:#6fd0a2; --bad:#f08f73; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111419; --sheet:#171b21; --sheet-2:#1e232b; --ink:#e5e7eb; --ink-2:#b3b9c4; --ink-3:#848b98;
  --rule:#2a3039; --rule-2:#38404b; --prussian:#94b4e6; --prussian-2:#b3caee; --prussian-soft:#1d2a3f; --wax:#e38b6f;
  --c-n:#86aef0; --c-a:#f08f73; --c-d:#6fd0a2; --c-g:#e2b75a; --c-v:#c9a0ea;
  --hl:#4a4224; --ok:#6fd0a2; --bad:#f08f73; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
/* Colour themes chosen in the top-bar menu. No data-theme = automatic (follows the system: light / dark).
   light and dark keep each book's own accent; wabi, roma and aka use their own accent for every book. */
:root[data-theme="wabi"]{
  --paper:#eeeae3; --sheet:#f6f3ee; --sheet-2:#e5dfd5; --ink:#2b2824; --ink-2:#57524b; --ink-3:#8a847a;
  --rule:#dbd4c8; --rule-2:#c8bfb0; --prussian:#6b5a45; --prussian-2:#86715a; --prussian-soft:#e6ddcf; --wax:#8a4b33;
  --c-n:#4f6a86; --c-a:#a0553c; --c-d:#4d7a5c; --c-g:#8c6d2c; --c-v:#76587f;
  --hl:#ebe0c0; --ok:#4d7a5c; --bad:#a0553c; --shadow:0 1px 2px rgba(60,50,40,.05); color-scheme:light;
  --f-frak:"Literata",Georgia,serif}
:root[data-theme="roma"]{
  --paper:#f3eee4; --sheet:#fbf8f1; --sheet-2:#ebe3d4; --ink:#241a14; --ink-2:#4f4238; --ink-3:#837668;
  --rule:#e0d5c3; --rule-2:#ccbda6; --prussian:#962b1f; --prussian-2:#b5432e; --prussian-soft:#f3e0d5; --wax:#a8801f;
  --c-n:#2f5a8f; --c-a:#b5432e; --c-d:#3a7350; --c-g:#9a6f12; --c-v:#6d3f7d;
  --hl:#f0e1ad; --ok:#3a7350; --bad:#b5432e; --shadow:0 1px 2px rgba(60,40,20,.07),0 8px 24px rgba(60,40,20,.08); color-scheme:light;
  --f-frak:"Cinzel","Trajan Pro",Georgia,serif}
:root[data-theme="aka"]{
  --paper:#0f0b0b; --sheet:#191313; --sheet-2:#241a1a; --ink:#f5ede7; --ink-2:#cbbdb4; --ink-3:#928279;
  --rule:#342628; --rule-2:#4b393a; --prussian:#ff4b37; --prussian-2:#ff8a1c; --prussian-soft:#3b1410; --wax:#ff8a1c;
  --c-n:#7fb0ff; --c-a:#ff7a5c; --c-d:#5fdc9e; --c-g:#ffc145; --c-v:#d69bff;
  --hl:#4d2a0e; --ok:#5fdc9e; --bad:#ff7a5c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(255,60,40,.08); color-scheme:dark}
:root[data-theme="wabi"] .bk-cover{filter:saturate(.35) brightness(1.08)}
:root[data-theme="wabi"] .book,:root[data-theme="wabi"] .sent,:root[data-theme="wabi"] .lesson{border-radius:4px}
:root[data-theme="roma"] .lib-mast,:root[data-theme="roma"] .mast{letter-spacing:.04em}
:root[data-theme="aka"] .tab[aria-selected="true"]{box-shadow:0 0 0 1px var(--prussian-2)}
:root[data-theme="aka"] .prog i{background:linear-gradient(90deg,var(--prussian),var(--prussian-2))}

/* theme menu */
.top-in{position:relative}
.theme-btn{margin-left:auto;width:34px;height:34px;border-radius:999px}
.tabs:not([hidden]) ~ .theme-btn{margin-left:0}
.theme-btn svg{width:18px;height:18px}
.theme-menu{position:absolute;right:16px;top:calc(100% + 6px);z-index:40;width:min(300px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--rule-2);border-radius:14px;box-shadow:var(--shadow);padding:6px}
@media (min-width:720px){.theme-menu{right:28px}}
.theme-menu h4{font:500 12px var(--f-mono);letter-spacing:.06em;color:var(--ink-3);margin:6px 10px 4px}
.th-opt{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer}
.th-opt:hover,.th-opt:focus-visible{background:var(--sheet-2)}
.th-opt b{font:600 14.5px var(--f-zh)}
.th-opt small{grid-column:2;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.th-sw{grid-row:span 2;display:flex;width:34px;height:34px;border-radius:50%;overflow:hidden;border:1px solid var(--rule-2);transform:rotate(-30deg)}
.th-sw i{flex:1}
.th-ck{grid-row:span 2;width:18px;height:18px;color:var(--prussian);visibility:hidden}
.th-opt[aria-checked="true"] .th-ck{visibility:visible}


*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-ui);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--prussian-2);outline-offset:2px;border-radius:4px}
i,em{font-family:var(--f-de)}
a{color:var(--prussian)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:12px;min-height:54px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand .frak{font:28px/1 var(--f-frak);color:var(--prussian)}
.brand .bt{font:600 15px/1.2 var(--f-de);white-space:nowrap}
@media (max-width:560px){.brand .bt{display:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-size:14px}
.tab:hover{background:var(--sheet-2)}
.tab[aria-selected="true"]{background:var(--prussian);color:var(--paper)}
.tab .cnt{font:500 11px var(--f-mono);margin-left:4px;opacity:.75}
.back{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13.5px;color:var(--ink);flex:none;max-width:46vw}
.back:hover{border-color:var(--prussian-2);color:var(--prussian)}
.back svg{width:18px;height:18px;flex:none}
.back #backLbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:3px;color:var(--ink-2)}
@media (max-width:560px){.back .bk-pre{display:none}.back{max-width:38vw}.top-in{gap:8px}}
.sent.flash{outline:2px solid var(--prussian-2);outline-offset:2px}
.qh{font:600 14px var(--f-ui);margin:16px 0 4px}
.qbox{margin:14px 0 6px;padding:2px 12px 6px;border:1px dashed var(--rule-2);border-radius:12px}
.qbox .qh{margin-top:10px;color:var(--prussian)}
.prog{height:3px;background:var(--rule)}
.prog i{display:block;height:100%;width:0;background:var(--prussian);transition:width .4s}

/* home */
.hero{padding-block:44px 28px;display:grid;gap:28px}
@media (min-width:960px){.hero{grid-template-columns:1.05fr .95fr;align-items:end;padding-block:64px 36px}}
.eyebrow{font:500 12px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mast{font:clamp(56px,11vw,112px)/.95 var(--f-frak);color:var(--prussian);margin:10px 0 6px;letter-spacing:.005em;overflow-wrap:anywhere}
.mast-sub{font:italic 400 clamp(18px,2.4vw,22px)/1.4 var(--f-de);color:var(--ink-2);margin:0;text-wrap:balance}
.lede{font:17px/1.75 var(--f-zh);margin:18px 0 0;max-width:34em;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule-2);background:var(--sheet);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--prussian-2)}
.btn.pri{background:var(--prussian);border-color:var(--prussian);color:var(--paper)}
.btn.pri:hover{background:var(--prussian-2)}
.btn svg{width:16px;height:16px;flex:none}
.demo{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px 20px 16px;box-shadow:var(--shadow);min-width:0}
.demo-cap{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.demo .zh{margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-block:8px 36px}
.stat{background:var(--sheet);padding:14px 16px}
.stat b{display:block;font:600 26px/1.1 var(--f-de);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
.how{display:grid;gap:16px;margin-bottom:56px}
@media (min-width:760px){.how{grid-template-columns:repeat(3,1fr)}}
.how div{border-top:2px solid var(--ink);padding-top:12px}
.how h3{font:600 16px/1.4 var(--f-zh);margin:0 0 6px}
.how p{margin:0;color:var(--ink-2);font-size:14px}
.how .n{font:500 12px var(--f-mono);color:var(--ink-3)}

/* section heads */
.sec-head{padding-block:32px 8px}
.sec-head h2{font:600 clamp(24px,3.4vw,32px)/1.25 var(--f-zh);margin:6px 0 4px;text-wrap:balance}
.sec-head p{margin:0;color:var(--ink-2);max-width:42em}

/* lessons */
.lessons{display:grid;gap:12px;padding-bottom:64px;max-width:860px}
.lesson{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.lesson>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;padding:16px 18px;cursor:pointer}
.lesson>button:focus-visible{outline:2px solid var(--prussian-2);outline-offset:-2px}
.lesson .ln{font:500 13px var(--f-mono);color:var(--prussian);width:2.2em;height:2.2em;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.lesson.done .ln{background:var(--prussian);color:var(--paper);border-color:var(--prussian)}
.lesson .lt{font:600 17px/1.35 var(--f-zh);display:block}
.lesson .ls{font:italic 14px var(--f-de);color:var(--ink-3)}
.lesson .lm{font:12px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.lesson-body{padding:2px 18px 20px;border-top:1px solid var(--rule);font:15.5px/1.85 var(--f-zh);min-width:0}
.lesson-body p{margin:.9em 0}
.lesson-body h4{font:600 17px/1.4 var(--f-zh);margin:1.8em 0 .4em;padding-top:.9em;border-top:1px dashed var(--rule-2)}
.lesson-body ul{padding-left:1.2em}
.lesson-body li{margin:.4em 0}
.lesson-foot{display:flex;justify-content:flex-end;margin-top:14px}
.ex{display:block;margin:12px 0;padding:12px 14px;background:var(--sheet-2);border-left:3px solid var(--prussian);border-radius:0 8px 8px 0}
td .ex,dt .ex{display:inline;margin:0;padding:0;background:none;border:0}
.ex .de{margin:0}
.tip{background:var(--prussian-soft);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14.5px}
.formula{font-family:var(--f-de);background:var(--sheet-2);padding:10px 14px;border-radius:8px}
.kbd{font:12px var(--f-mono);border:1px solid var(--rule-2);border-radius:4px;padding:0 5px}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
.tbl thead th{font:500 12px var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.tbl th small{font:400 11px var(--f-mono);color:var(--ink-3)}
.case-tbl td{font:17px var(--f-de);text-align:center}
.case-tbl td.hot{background:var(--hl);font-weight:600}
.case-tbl{max-width:520px}
.c-n{color:var(--c-n)}.c-a{color:var(--c-a)}.c-d{color:var(--c-d)}.c-g{color:var(--c-g)}.c-v{color:var(--c-v)}
.concepts dt{font:600 17px var(--f-de);margin-top:16px}
.concepts dd{margin:4px 0 0;color:var(--ink-2)}
.steps{padding-left:1.4em}
.steps>li{margin:1em 0;padding-left:.2em}
.steps>li::marker{font:600 15px var(--f-mono);color:var(--prussian)}

/* role diagram (lesson) */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:14px 0}
.role{--c:var(--ink-3);border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:8px;padding:10px 10px 8px;background:var(--sheet);display:flex;flex-direction:column;gap:2px;min-width:0}
.role[data-c="n"]{--c:var(--c-n)}.role[data-c="a"]{--c:var(--c-a)}.role[data-c="d"]{--c:var(--c-d)}.role[data-c="g"]{--c:var(--c-g)}.role[data-c="v"]{--c:var(--c-v)}
.role .rw{font:600 17px var(--f-de)}
.role .rq{font:12px var(--f-mono);color:var(--ink-3)}
.role .rz{font:15px var(--f-zh)}
.role b{font:600 12px var(--f-ui);color:var(--c);margin-top:4px}
/* attachment diagram (lesson) */
.attach{display:grid;gap:10px;margin:14px 0}
.arow{display:grid;grid-template-columns:auto auto auto;justify-content:start;align-items:center;gap:6px 10px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.arow .alab{grid-column:1/-1;font-size:14px;color:var(--ink-2)}
.ahead{font:600 16px var(--f-de);padding:3px 8px;border:1px solid var(--rule-2);border-radius:6px}
.aarr{font-size:20px;color:var(--ink-3)}
.adep{font:600 16px var(--f-de);padding:3px 8px;border-radius:6px;color:var(--paper);background:var(--c-d)}
.adep[data-c="g"]{background:var(--c-g)}
@media (min-width:640px){.arow{grid-template-columns:auto auto auto 1fr}.arow .alab{grid-column:auto}}

/* quiz */
.quiz{display:grid;gap:10px;margin:12px 0}
.qscore{font:500 13px var(--f-mono);color:var(--ink-3)}
.qi{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.qi .de{margin:0 0 8px;font-size:calc(1.08rem * var(--scale))}
.qi .w.tgt .wd{background:var(--hl);font-weight:600;padding:0 .2em}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}
.qopt:hover{border-color:var(--prussian-2)}
.qopt[disabled]{cursor:default;opacity:.6}
.qopt.right{opacity:1;background:var(--ok);border-color:var(--ok);color:var(--paper)}
.qopt.wrong{opacity:1;border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.qwhy{margin-top:8px;font-size:14px;color:var(--ink-2)}
.qwhy b{font-weight:600}
.qwhy.ok b{color:var(--ok)}.qwhy.no b{color:var(--bad)}
.qreset{justify-self:start}

/* reader */
.read-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:8px}
.ptoc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.ptoc::-webkit-scrollbar{display:none}
.pchip{flex:none;border:1px solid var(--rule-2);background:var(--sheet);border-radius:8px;padding:4px 10px 6px;cursor:pointer;font:500 13px var(--f-mono);position:relative;overflow:hidden;min-width:40px}
.pchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--prussian);width:0}
.pchip.cur{border-color:var(--prussian);color:var(--prussian)}
.toggles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tg{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tg.sq{padding:4px 10px;font-family:var(--f-de)}
.legend{display:none;gap:10px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend.on{display:flex}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;margin-right:4px;vertical-align:middle;background:currentColor}
.reader{display:grid;gap:28px;padding-block:20px 80px}
@media (min-width:1024px){.reader{grid-template-columns:minmax(0,1fr) 340px}}
.para{margin-bottom:34px;scroll-margin-top:170px}
/* chapters of a long book */
.chlist{display:grid;gap:8px;margin-bottom:48px;scroll-margin-top:90px}
.chlist-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.chlist-h h2{font:600 20px/1.3 var(--f-zh);margin:0}
.chlist-h small{font:12.5px var(--f-mono);color:var(--ink-3)}
.ch-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;cursor:pointer;min-width:0}
.ch-row:hover{border-color:var(--prussian-2)}
.ch-row:focus-visible{outline:2px solid var(--prussian-2);outline-offset:2px}
.ch-row.planned{cursor:default;border-style:dashed;background:transparent}
.ch-row.planned:hover{border-color:var(--rule)}
.ch-n{font:500 13px var(--f-mono);color:var(--prussian);width:2.3em;height:2.3em;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;grid-row:span 2}
.ch-row.done .ch-n{background:var(--prussian);color:var(--paper);border-color:var(--prussian)}
.ch-row.planned .ch-n{color:var(--ink-3);border-style:dashed}
.ch-t{min-width:0}
.ch-t b{font:600 16.5px/1.35 var(--f-zh);display:block}
.ch-t i{font:italic 14px var(--f-de);color:var(--ink-3)}
.ch-b{grid-column:2/4;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.ch-s{font:12px var(--f-mono);color:var(--ink-3);white-space:nowrap;text-align:right;display:grid;gap:5px;justify-items:end}
.ch-s .bar{display:block;width:64px;height:3px;background:var(--rule);border-radius:2px;overflow:hidden}

.chbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;min-width:0}

.sent{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 16px 10px;margin-bottom:12px;scroll-margin-top:170px;min-width:0}

.sl-back{display:inline-flex;align-items:center;gap:4px;font:12.5px var(--f-ui);color:var(--ink-3);background:none;border:1px solid var(--rule);border-radius:999px;padding:2px 10px 2px 6px;margin-bottom:8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

body.loading main{opacity:.55;transition:opacity .2s .15s}
.wd{border-radius:3px;padding:0 .04em;transition:background .12s}

.de.color .w[data-v="1"] .wd{color:var(--c-v);font-weight:600}

.de.color .w[data-c="n"] .wd{box-shadow:inset 0 -2px 0 var(--c-n)}

.de.color .w[data-c="d"] .wd{box-shadow:inset 0 -2px 0 var(--c-d)}
.de.color .w[data-c="g"] .wd{box-shadow:inset 0 -2px 0 var(--c-g)}
.de.color .w.on .wd{color:var(--paper)}
.zh{font:calc(1rem * var(--scale))/1.85 var(--f-zh);color:var(--ink);background:var(--sheet-2);border-radius:8px;padding:10px 12px;margin:8px 0 4px}
.notes{margin:8px 0 4px;padding:10px 12px 10px 30px;border-left:2px solid var(--prussian);font:14.5px/1.8 var(--f-zh);color:var(--ink-2)}

.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:none;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}

/* word slip */

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}

.sl-sec{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:72vh;overflow:auto;border-radius:16px 16px 0 0;border:1px solid var(--rule);border-bottom:0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s ease;background:var(--sheet)}

.fb-line{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}

<script>
const LIB = /*@LIB@*/;

(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]!=null?o[k]:'');
const mkStore=ns=>({get(k,d){try{const v=localStorage.getItem(ns+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(ns+k,JSON.stringify(v))}catch(e){}}});
const ICON={
  back:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  say:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>',
  zh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c-1 4-4 7-7 8"/><path d="m13 20 4-9 4 9M14.5 17h5"/></svg>',
  gram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* ---------- library index ---------- */
const BOOKS={}, COURSES={};
LIB.books.forEach(b=>BOOKS[b.id]=b); LIB.courses.forEach(c=>COURSES[c.id]=c);
/* Data arrives in pieces: the shelf (this page) is inline; each book's text + lexicon and the shared
   dictionary are separate JSON files fetched on first use (or inlined in LIB.data for one-file builds). */
const LOADS={};
function load(name){
  if(LOADS[name]) return LOADS[name];
  const inl=LIB.data&&LIB.data[name];
  return LOADS[name]=inl?Promise.resolve(inl):fetch('data/'+name+'.json?v='+LIB.v).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(e=>{ delete LOADS[name]; throw e; });
}
async function ensureBook(id){ const b=BOOKS[id]; if(!b.lex) Object.assign(b, await load(id)); return b; }
/* A long book is split into chapters (BOOKS[id].chapters). The lexicon, lessons and a word → chapters index
   come with the book; each chapter's text is its own file, fetched when the chapter is opened. Sentence ids
   carry the chapter: "<chapter>-<part>-<sentence>"; books without chapters keep "<part>-<sentence>". */
const isCh=id=>!!(BOOKS[id]&&BOOKS[id].chapters);
const liveChs=id=>BOOKS[id].chapters.filter(c=>!c.planned);
const chOf=(id,cid)=>BOOKS[id].chapters.find(c=>c.id===cid);
async function ensureChapter(id,cid){ const b=BOOKS[id]; b.chText=b.chText||{}; if(!b.chText[cid]) b.chText[cid]=(await load(id+'.'+cid)).text; return b.chText[cid]; }
function sentIds(id){ const b=BOOKS[id], out=[]; const add=(pre,toc)=>toc.forEach((t,pi)=>{ for(let si=0;si<t[1];si++) out.push(pre+pi+'-'+si); });
  if(b.chapters) liveChs(id).forEach(c=>add(c.id+'-',c.toc)); else add('',b.toc); return out; }
const SIDRE=/^(?:([a-z0-9]+)-)?(\d+)-(\d+)$/;
function sidLabel(id,sid){ const b=BOOKS[id], m=SIDRE.exec(sid); if(!m) return ''; let toc=b.toc, pre='';
  if(b.chapters){ const c=m[1]&&chOf(id,m[1]); if(!c||!c.toc) return ''; toc=c.toc; pre=c.n+'·'; }
  const t=toc&&toc[+m[2]]; return t?pre+sentLabel(t[0],+m[3],t[1]):''; }
function occIndex(b){ if(!b.occ) return null; if(b.OCCX) return b.OCCX; const o={}, f={};
  for(const k in b.occ){ o[k]=b.occ[k].split(',').map(x=>{ const [c,n,sid]=x.split(':'); return [c,+n,sid]; }); f[k]=o[k].reduce((a,x)=>a+x[1],0); }
  b.FREQ=f; return b.OCCX=o; }
function defaultCh(id){ const live=liveChs(id), last=mkStore('reader.'+id+'.').get('ch',null);
  if(last && live.some(c=>c.id===last)) return last;
  const ok=new Set(mkStore('reader.'+id+'.').get('ok',[])), nx=sentIds(id).find(x=>!ok.has(x));
  return nx?SIDRE.exec(nx)[1]:live[0].id; }
let DICT=null;
const DEFPROF=LIB.profiles[Object.keys(LIB.profiles)[0]];
const PX=()=>C?C.P:DEFPROF;
function sentLabel(k,si,n){ return /^\w+$/.test(k)?k+'.'+(si+1):(n>1?k+' '+(si+1):k); }
const UI=mkStore('reader.ui.');
// carry progress over from older single-book versions of this page
LIB.books.forEach(b=>{ const leg=b.meta&&b.meta.legacyStorage; if(!leg) return; try{
  for(const k of ['ok','saved']){ const o=localStorage.getItem(leg+k); const nk='reader.'+b.id+'.'+k; if(o!=null && localStorage.getItem(nk)==null) localStorage.setItem(nk,o); }
  for(const k of ['gloss','color','zhAll','scale']){ const o=localStorage.getItem('reader.'+b.id+'.'+k)??localStorage.getItem(leg+k); if(o!=null && localStorage.getItem('reader.ui.'+k)==null) localStorage.setItem('reader.ui.'+k,o); }
}catch(e){} });

const PREP={};
function prep(bookId,cid){
  cid=cid||null; const key=bookId+(cid?'|'+cid:'');
  if(PREP[key]) return PREP[key];
  const b=BOOKS[bookId], P=LIB.profiles[b.meta.profile];
  const TOK=new RegExp('(\\(?)(['+P.letters+']+)(?:\\{([^}]*)\\})?([.,;:!?)\\-]*)','g');
  const ch=cid?chOf(bookId,cid):null, text=b.chapters?(cid?b.chText[cid]:[]):b.text, pre=cid?cid+'-':'';
  const x={P, LEX:b.lex, TEXT:text, ch, cid, OCCX:occIndex(b), FREQ:b.FREQ||null, TOK, WORD:new RegExp('['+P.letters+']+','g'), KEYRE:new RegExp(P.keyPattern), SENTS:[], OCC:{}, LEMMA:{}};
  const resolveIn=(w,k)=>resolveWith(x,w,k);
  text.forEach((p,pi)=>p.s.forEach((s,si)=>{
    const id=pre+pi+'-'+si; const k=p.k!=null?String(p.k):String(pi);
    const label=(ch?ch.n+'·':'')+sentLabel(k,si,p.s.length);
    x.SENTS.push({id,pi,si,s,label});
    const re=new RegExp(TOK.source,'g'); let m; const t=s.de.replace(/[*_]/g,'');
    while((m=re.exec(t))){ const r=resolveIn(m[2],m[3]); if(!r.id) continue; const o=(x.OCC[r.id]=x.OCC[r.id]||[]); if(o[o.length-1]!==id) o.push(id); }
  }));
  for(const id in b.lex){ const lem=b.lex[id][0]; (x.LEMMA[lem]=x.LEMMA[lem]||[]).push(id); }
  return PREP[key]=x;
}
function resolveWith(x,word,key){
  const w=word.toLowerCase(); let id=null, cs=null, named=null;
  if(key) for(const k of key.split(':')){
    if(x.KEYRE.test(k)) cs=k;
    else if(x.LEX[w+'#'+k]){ id=w+'#'+k; named=k; }
  }
  if(!id && x.LEX[w]) id=w;
  return {w, id, cs, named, d:id?x.LEX[id]:null};
}

/* ---------- context: the book or course on screen ---------- */
let C=null, S=null;
const usable=id=>(BOOKS[id]&&!BOOKS[id].planned)||!!COURSES[id];
function makeCtx(id,cid){
  if(BOOKS[id] && !BOOKS[id].planned){ const b=BOOKS[id]; return Object.assign({kind:'book', id, meta:b.meta, lessons:b.lessons||[], textBook:id}, prep(id,cid)); }
  if(COURSES[id]){ const c=COURSES[id]; return Object.assign({kind:'course', id, meta:c.meta, lessons:c.lessons||[], textBook:c.meta.lexiconFrom}, prep(c.meta.lexiconFrom)); }
  return null;
}
const lkey=(l,i)=>l.id||String(i);
function loadState(){
  const own=mkStore('reader.'+C.id+'.'), data=mkStore('reader.'+C.textBook+'.');
  // lesson progress is keyed by lesson id, so lessons can be inserted or reordered; older saves used positions
  const legacy=C.meta.legacyOrder||C.lessons.map(lkey), old=v=>typeof v==='number'?legacy[v]:v;
  const q2=own.get('quiz2',null), quiz=own.get('quiz3',null)||(q2?Object.fromEntries(Object.entries(q2).map(([k,v])=>[legacy[+k]??k,v])):{});
  S={own,data, ok:new Set(data.get('ok',[])), saved:data.get('saved',[]), lessons:new Set(own.get('lessons',[]).map(old).filter(x=>x!=null)), quiz,
     gloss:UI.get('gloss',true), color:UI.get('color',false), zhAll:UI.get('zhAll',false), scale:UI.get('scale',1)};
}
const persist=()=>{ S.data.set('ok',[...S.ok]); S.data.set('saved',S.saved); S.own.set('lessons',[...S.lessons]); S.own.set('quiz3',S.quiz);
  UI.set('gloss',S.gloss); UI.set('color',S.color); UI.set('zhAll',S.zhAll); UI.set('scale',S.scale); };

const resolve=(w,k)=>resolveWith(C,w,k);
function caseText(cs){ const P=C.P, c=cs[0], g=cs[1]; return (g===P.plural?P.genders[g]:P.genders[g]+' · 单数')+' · '+P.cases[c].name+'（'+P.cases[c].num+'）'; }
function gloss(r){
  if(!r.d) return '';
  const P=C.P, [lemma,pos,gram,mean]=r.d;
  if(r.cs && P.taggedPos.includes(pos)){
    const tag=fmt(P.glossTag,{g:P.genders[r.cs[1]][0],c:P.cases[r.cs[0]].name[0]});
    return (r.named&&P.namedTags[r.named]?P.namedTags[r.named]+' ':'')+tag;
  }
  return mean.split('；')[0];
}
const verbFlag=pos=>{ const P=PX(); return P.verbPos.includes(pos)?'1':(P.verbLightPos.includes(pos)?'2':''); };
function plain(de){ return de.replace(/\{[^}]*\}/g,'').replace(/<<|>>/g,'').replace(/[*_]/g,''); }
function renderDe(de, sid){
  let out='';
  for(const part of de.split(/(\*[^*]+\*|_[^_]+_|<<[^>]+>>)/)){
    if(!part) continue;
    let cls='', t=part;
    if(/^\*.*\*$/.test(part)){cls=' sp'; t=part.slice(1,-1);}
    else if(/^_.*_$/.test(part)){cls=' la'; t=part.slice(1,-1);}
    else if(/^<<.*>>$/.test(part)){cls=' tgt'; t=part.slice(2,-2);}
    let last=0, m; const re=new RegExp(C.TOK.source,'g');
    while((m=re.exec(t))){
      out+=esc(t.slice(last,m.index));
      const r=resolve(m[2],m[3]); const pos=r.d?r.d[1]:''; const v=pos?verbFlag(pos):'';
      out+=esc(m[1])+'<span class="w'+cls+'" tabindex="0" role="button" data-w="'+esc(m[2])+'" data-k="'+esc(m[3]||'')+'" data-id="'+esc(r.id||'')+'"'+(pos?' data-pos="'+pos+'"':'')+(v?' data-v="'+v+'"':'')+(r.cs?' data-c="'+r.cs[0]+'"':'')+(sid?' data-s="'+sid+'"':'')+'><span class="wd">'+esc(m[2])+esc(m[4])+'</span><span class="gl">'+esc(gloss(r))+'</span></span>';
      last=re.lastIndex;
    }
    out+=esc(t.slice(last));
  }
  return out;
}
const freq=id=>C.FREQ?(C.FREQ[id]||0):(C.OCC[id]||[]).length;

/* ---------- speech & toast ---------- */
const canSpeak='speechSynthesis' in window; let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices()}catch(e){} }
if(canSpeak){ loadVoices(); try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){} }
function germanVoice(){ const tts=C?C.P.tts:'de-DE', tl=tts.split('-')[0]; const vs=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(tl)); return {tts, v:vs.find(v=>v.lang===tts&&v.localService)||vs.find(v=>v.lang===tts)||vs[0]}; }
function say(text){
  if(!canSpeak){ toast('这个浏览器不支持朗读'); return; }
  if(typeof PL!=='undefined' && PL.on) plStop();
  const tts=C?C.P.tts:'de-DE', tl=tts.split('-')[0];
  const vs=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(tl));

    if(w.named && !w.named.includes(r.named)) ok=false;
    if(w.lemma && !w.lemma.includes(lem)) ok=false;
    if(w.lemmaStem){ if(lem in w.lemmaStem) stem=w.lemmaStem[lem]; else ok=false; }
    if(w.surface && (!w.surface.includes(r.w) || r.named)) ok=false;
    if(!ok) continue;
    const ov=(t.override&&t.override[lem])||{};
    return {name:t.name, cell:(c,g)=>ov[c+'.'+g]!=null?ov[c+'.'+g]:(t.full?t.full[c][g]:stem+t.endings[c][g])};
  }

}
function caseTable(r){

function whyCase(r, el){

/* ---------- listen to the whole text ----------
   Reads sentence by sentence with the device's German voice, highlighting the sentence (and the word, where
   the voice reports word boundaries), scrolling along and showing the translation. Long sentences are cut at
   punctuation, because some browsers stop a single utterance after ~15 seconds. Pausing = stopping and
   restarting the current piece, which works the same on every browser. Keeps the screen awake while playing. */
const PICON={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>'};
const RATES=[.7,.85,1,1.15];
const PL={on:false, paused:false, i:0, ci:0, chunks:[], words:[], token:0, rate:UI.get('rate',.85), zh:UI.get('plZh',true), lock:null};
$('#plPrev').innerHTML=PICON.prev; $('#plNext').innerHTML=PICON.next; $('#plX').innerHTML=ICON.x; $('#tgPlay').insertAdjacentHTML('afterbegin',PICON.play);
function chunksOf(t){
  const out=[]; let base=0;
  while(t.length-base>220){ const seg=t.slice(base,base+220); let cut=Math.max(seg.lastIndexOf(', '),seg.lastIndexOf('; '),seg.lastIndexOf(': ')); if(cut<60) cut=seg.lastIndexOf(' '); if(cut<1) cut=219; out.push({t:t.slice(base,base+cut+1),base}); base+=cut+1; }
  out.push({t:t.slice(base),base}); return out.filter(c=>c.t.trim());
}
function plUi(){
  const x=C&&C.SENTS[PL.i]; if(!x) return;
  $('#plLab').textContent='§ '+x.label+' · '+(PL.i+1)+' / '+C.SENTS.length;
  $('#plZh').textContent=x.s.zh; $('#plZh').hidden=!PL.zh; $('#plZhBtn').setAttribute('aria-pressed',PL.zh);
  $('#plMain').innerHTML=PL.paused?PICON.play:PICON.pause; $('#plMain').setAttribute('aria-label',PL.paused?'继续':'暂停');
  $('#plRate').textContent=PL.rate+'×';
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({title:'§ '+x.label, artist:C.meta.author||'', album:C.meta.title}); navigator.mediaSession.playbackState=PL.paused?'paused':'playing'; }catch(e){} }
}
function plMark(){
  $$('.sent.playing').forEach(a=>a.classList.remove('playing')); $$('.w.speaking').forEach(w=>w.classList.remove('speaking'));
  const x=C.SENTS[PL.i], art=document.getElementById('s-'+x.id); if(!art) return;
  art.classList.add('playing');
  const r=art.getBoundingClientRect(), top=$('.read-tools').getBoundingClientRect().bottom;
  if(r.top<top || r.top>innerHeight*.55) scrollBelowTools(art,true);
  const t=plain(x.s.de); let at=0; PL.words=[...art.querySelectorAll('.de .w')].map(w=>{ const k=t.indexOf(w.dataset.w,at); if(k>=0) at=k+w.dataset.w.length; return {w,k}; }).filter(o=>o.k>=0);
}
function plWord(idx){
  let hit=null; for(const o of PL.words){ if(o.k<=idx) hit=o; else break; }
  $$('.w.speaking').forEach(w=>w.classList.remove('speaking')); if(hit) hit.w.classList.add('speaking');
}
function plSpeak(ci){
  const tok=++PL.token; try{ speechSynthesis.cancel(); }catch(e){}
  const ch=PL.chunks[ci]; PL.ci=ci;
  if(!ch){ if(PL.i<C.SENTS.length-1){ setTimeout(()=>{ if(tok===PL.token&&PL.on&&!PL.paused){ PL.i++; plSentence(); } },380); } else plStop(C.ch?'本章读完了':'全文读完了'); return; }
  const {tts,v}=germanVoice(), u=new SpeechSynthesisUtterance(ch.t); u.lang=tts; if(v) u.voice=v; u.rate=PL.rate;
  u.onboundary=e=>{ if(tok===PL.token && e.name!=='sentence') plWord(ch.base+e.charIndex); };
  u.onend=()=>{ if(tok===PL.token && PL.on && !PL.paused) plSpeak(ci+1); };
  u.onerror=e=>{ if(tok===PL.token && !/interrupted|canceled/.test(e.error||'')) plStop('朗读中断：'+(e.error||'')); };
  speechSynthesis.speak(u);
}
function plSentence(){ PL.chunks=chunksOf(plain(C.SENTS[PL.i].s.de)); plMark(); plUi(); plSpeak(0); }
function plStart(i){
  if(!canSpeak){ toast('这个浏览器不支持朗读'); return; }
  if(!germanVoice().v && voices.length) toast('没有找到德语语音，可在系统设置里添加；先用默认语音朗读');
  PL.on=true; PL.paused=false; PL.i=i; $('#player').hidden=false; document.body.classList.add('playing');
  try{ if(navigator.wakeLock && !PL.lock) navigator.wakeLock.request('screen').then(l=>PL.lock=l).catch(()=>{}); }catch(e){}
  plSentence();
}
function plStop(msg){
  if(!PL.on) return; PL.on=false; PL.paused=false; PL.token++; try{ speechSynthesis.cancel(); }catch(e){}
  $('#player').hidden=true; document.body.classList.remove('playing');
  $$('.sent.playing').forEach(a=>a.classList.remove('playing')); $$('.w.speaking').forEach(w=>w.classList.remove('speaking'));
  try{ PL.lock&&PL.lock.release(); }catch(e){} PL.lock=null;
  if(msg) toast(msg);
}
function plToggle(){ if(!PL.on) return; PL.paused=!PL.paused; if(PL.paused){ PL.token++; try{ speechSynthesis.cancel(); }catch(e){} plUi(); } else { plUi(); plSpeak(PL.ci); } }
function plGo(d){ if(!PL.on) return; const n=PL.i+d; if(n<0||n>=C.SENTS.length) return; PL.i=n; PL.paused=false; plSentence(); }
function firstVisibleSent(){ const top=$('.read-tools').getBoundingClientRect().bottom; const arts=$$('#text .sent'); const a=arts.find(a=>a.getBoundingClientRect().bottom>top+40)||arts[0]; return a?C.SENTS.findIndex(x=>'s-'+x.id===a.id):0; }
$('#tgPlay').onclick=()=>plStart(Math.max(0,firstVisibleSent()));
$('#plMain').onclick=plToggle; $('#plPrev').onclick=()=>plGo(-1); $('#plNext').onclick=()=>plGo(1); $('#plX').onclick=()=>plStop();
$('#plRate').onclick=()=>{ PL.rate=RATES[(RATES.indexOf(PL.rate)+1)%RATES.length]; UI.set('rate',PL.rate); plUi(); if(PL.on&&!PL.paused) plSpeak(PL.ci); };
$('#plZhBtn').onclick=()=>{ PL.zh=!PL.zh; UI.set('plZh',PL.zh); plUi(); };
if('mediaSession' in navigator){ try{ navigator.mediaSession.setActionHandler('play',()=>PL.paused&&plToggle()); navigator.mediaSession.setActionHandler('pause',()=>!PL.paused&&plToggle());
  navigator.mediaSession.setActionHandler('previoustrack',()=>plGo(-1)); navigator.mediaSession.setActionHandler('nexttrack',()=>plGo(1)); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && PL.lock===null && PL.on){ try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>PL.lock=l).catch(()=>{}); }catch(e){} } });

/* ---------- navigation ----------
   Routes are plain hash tokens:  lib  ·  <book>~home|intro|read|vocab|saved  ·  <book>~s-1-0 (one sentence)
   ·  chaptered books: <book>~toc (table of contents) · <book>~ch-<chapter> · <book>~s-<chapter>-1-0
   ·  <book>~intro-2 (lesson 2)  ·  <course>~intro  ·  <course>~intro-3.
   An in-page stack drives the ← back button, because the app viewer shows no browser chrome.
   When the frame allows it, each step is mirrored into history.pushState, so the browser's back button,
   Android's back key and iOS swipe-back follow the same path. An open word sheet on a phone is its own
   history step, so back closes the sheet before it leaves the page you are on. */
const SUBS=['home','intro','read','vocab','saved'];
const VIEWNAME={lib:'书架',home:'导读',intro:'课程',read:'精读',vocab:'词汇表',saved:'生词本'};
const NAV={stack:[], cur:null, shown:null, hist:true, sheetEntry:false, popSeen:0};
const viewY={};
function parse(t){
  if(!t||t==='lib') return {ctx:null, sub:'lib'};
  const i=t.indexOf('~');
  if(i<0) return /^(home|intro|read|vocab|saved|s-\d+-\d+|intro-\d+)$/.test(t)?{ctx:LIB.default, sub:t}:null;   // links from the single-book version
  return {ctx:t.slice(0,i), sub:t.slice(i+1)};
}
const canon=t=>{ const r=parse(t); return !r?'lib':(r.ctx?r.ctx+'~'+r.sub:'lib'); };
function validRoute(t){
  const r=parse(t); if(!r) return false; if(r.sub==='lib') return true;
  if(!usable(r.ctx)) return false;
  const isCourse=!!COURSES[r.ctx];
  if(isCourse) { if(r.sub==='intro') return true; const m=/^intro-(\d+)$/.exec(r.sub); return !!m && +m[1]>=1 && +m[1]<=(COURSES[r.ctx].lessons||[]).length; }
  if(SUBS.includes(r.sub)) return true;
  const b=BOOKS[r.ctx];
  if(r.sub==='toc') return !!b.chapters;
  let m=/^ch-([a-z0-9]+)$/.exec(r.sub); if(m) return !!b.chapters && liveChs(r.ctx).some(c=>c.id===m[1]);
  m=/^s-(.+)$/.exec(r.sub); if(m){ const k=SIDRE.exec(m[1]); if(!k || !!k[1]!==!!b.chapters) return false;
    const toc=b.chapters?(chOf(r.ctx,k[1])||{}).toc:b.toc, t=toc&&toc[+k[2]]; return !!t && +k[3]<t[1]; }
  m=/^intro-(\d+)$/.exec(r.sub); if(m) return +m[1]>=1 && +m[1]<=BOOKS[r.ctx].nLessons;
  return false;
}
const viewOfSub=s=>/^(s|ch)-/.test(s)?'read':/^intro-/.test(s)?'intro':s==='toc'?'home':s;
const viewKey=t=>{ const r=parse(t); return r.ctx?r.ctx+'~'+viewOfSub(r.sub):'lib'; };
function ctxTitle(id){ const m=BOOKS[id]?BOOKS[id].meta:COURSES[id].meta; return m.short||m.title; }
function routeLabel(t){
  const r=parse(t); if(r.sub==='lib') return '书架';
  let lab=/^s-/.test(r.sub)?'§ '+sidLabel(COURSES[r.ctx]?COURSES[r.ctx].meta.lexiconFrom:r.ctx, r.sub.slice(2))
         :/^ch-/.test(r.sub)?'第 '+((chOf(r.ctx,r.sub.slice(3))||{}).n||'')+' 章'
         :r.sub==='toc'?'目录'
         :/^intro-/.test(r.sub)?'第 '+r.sub.slice(6)+' 课':(COURSES[r.ctx]?'':VIEWNAME[r.sub]);
  if(!C || C.id!==r.ctx || COURSES[r.ctx]) lab=ctxTitle(r.ctx)+(lab?' · '+lab:'');
  return lab;
}
function showView(v){
  if(v!=='read' && typeof PL!=='undefined') plStop();
  ['lib',...SUBS].forEach(x=>{ $('#v-'+x).hidden = x!==v; });
  $$('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.go===v));
  if(v==='vocab') renderVocab(); if(v==='saved') renderSaved(); if(v==='lib') renderLibrary();
  if(v==='home' && C){ renderChapterList(); updateCont(); }
}
let renderSeq=0;
async function render(t, y){
  const seq=++renderSeq;
  const r=parse(t), v=r.ctx?viewOfSub(r.sub):'lib';
  let cid=null;
  if(r.ctx && isCh(r.ctx)){
    const m=/^ch-([a-z0-9]+)$/.exec(r.sub)||/^s-([a-z0-9]+)-\d+-\d+$/.exec(r.sub);
    cid=m?m[1]:v==='read'?defaultCh(r.ctx):(C&&C.id===r.ctx?C.cid:null);
  }
  // the reading position is remembered per chapter
  const key=viewKey(t)+(v==='read'&&cid?'@'+cid:''), same=NAV.shown===key;
  if(NAV.shown && !same) viewY[NAV.shown]=scrollY;
  if(r.ctx){
    const need=COURSES[r.ctx]?COURSES[r.ctx].meta.lexiconFrom:r.ctx;
    if(!BOOKS[need].lex || (cid && !(BOOKS[need].chText||{})[cid])){
      document.body.classList.add('loading');
      try{ await ensureBook(need); if(cid) await ensureChapter(need,cid); }catch(e){ document.body.classList.remove('loading'); toast('加载失败，请检查网络后重试'); return; }
      document.body.classList.remove('loading');
      if(seq!==renderSeq) return;
    }
    enterCtx(r.ctx,cid);
  } else leaveCtx();
  showView(v); NAV.shown=key;
  const run=()=>{
    if(y!=null) window.scrollTo(0,y);
    else if(/^s-/.test(r.sub)) jump(r.sub.slice(2), same);
    else if(/^intro-/.test(r.sub)) openLesson(+r.sub.slice(6)-1);
    else if(/^ch-/.test(r.sub)) window.scrollTo(0, same?scrollY:(viewY[key]||0));
    else if(r.sub==='toc'){ const el=$('#chlist'); if(el && !el.hidden) el.scrollIntoView({block:'start'}); }
    else window.scrollTo(0, viewY[key]||0);
  };
  requestAnimationFrame(()=>requestAnimationFrame(run));
}
function histWrite(state, replace){
  if(!NAV.hist) return;
  try{ replace? history.replaceState(state,'','#'+state.t) : history.pushState(state,'','#'+state.t); }catch(e){ NAV.hist=false; }
}
function navigate(t, opts={}){
  t=canon(t); if(!validRoute(t)) t='lib';
  const r=parse(t);
  if((r.sub==='lib'||SUBS.includes(r.sub)) && NAV.cur && viewKey(NAV.cur)===viewKey(t)){ closeSheet(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const fromSheet=NAV.sheetEntry; NAV.sheetEntry=false; hideSheet();
  if(NAV.cur && !opts.replace) NAV.stack.push({t:NAV.cur, y:scrollY});
  NAV.cur=t; render(t);
  histWrite({t, i:NAV.stack.length}, opts.replace||fromSheet);
  updateBack();
}
function popTo(n, forceY){
  let e=null; while(NAV.stack.length>n) e=NAV.stack.pop();
  if(!e) return;
  NAV.cur=e.t; render(e.t, forceY!=null?forceY:e.y); updateBack();
}
function goBack(){
  if(sheetOpen()){ closeSheet(); return; }
  if(!NAV.stack.length) return;
  if(NAV.hist){
    const seen=NAV.popSeen, target=NAV.stack.length-1;
    try{ history.back(); }catch(e){ NAV.hist=false; }
    setTimeout(()=>{ if(NAV.popSeen===seen && NAV.stack.length>target){ NAV.hist=false; popTo(target); } },350);
    if(NAV.hist) return;
  }
  popTo(NAV.stack.length-1);
}
window.addEventListener('popstate',e=>{
  NAV.popSeen++;
  const st=e.state;
  if(NAV.sheetEntry){ NAV.sheetEntry=false; hideSheet(); if(st && !st.sheet && st.i===NAV.stack.length) return; }
  if(!st || st.t==null){ const h=canon((location.hash||'').slice(1)); if(validRoute(h) && h!==NAV.cur) navigate(h); return; }
  if(st.sheet) return;
  if(st.i < NAV.stack.length) popTo(st.i);
  else if(st.i > NAV.stack.length){ NAV.stack.push({t:NAV.cur, y:scrollY}); NAV.cur=st.t; render(st.t); updateBack(); }
  else if(st.t!==NAV.cur){ NAV.cur=st.t; render(st.t); updateBack(); }
});
function updateBack(){
  const b=$('#backBtn'); const top=NAV.stack[NAV.stack.length-1];
  b.hidden=!top; document.body.classList.toggle('has-back',!!top);
  if(top){ const l=routeLabel(top.t); $('#backLbl').textContent=l; b.setAttribute('aria-label','返回'+l); }
}
$('#backBtn').addEventListener('click',goBack);
try{ history.scrollRestoration='manual'; }catch(e){}

/* ---------- global clicks & keys ---------- */
$('#contBtn').addEventListener('click',()=>{ const n=nextSent()||firstSent(); navigate(C.id+'~s-'+n.id); });
document.addEventListener('click',e=>{
  const lw=e.target.closest('.lw');
  if(lw){ e.preventDefault(); const id=lw.dataset.l, t=lw.textContent; openWord({w:t,id,cs:null,named:null,d:entryOf(id)}, t.replace(/[-·]/g,''), null, lw, !!lw.closest('#sheet,#slipDesk')); return; }
  const rt=e.target.closest('[data-route]'); if(rt){ e.preventDefault(); navigate(rt.dataset.route); return; }
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); if(C) navigate(C.id+'~'+g.dataset.go); return; }
  const rp=e.target.closest('[data-report]');
  if(rp){ e.preventDefault(); const k=rp.dataset.report; if(k==='page'){ const a=document.createElement('a'); a.href='https://github.com/'+LIB.site.repo+'#'+encodeURIComponent('发现错误怎么办'); a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); } else fbOpen(k, rp); return; }
  const sb=e.target.closest('[data-slipback]'); if(sb){ const pv=SLIP.hist.pop(); if(pv) openWord(pv.r,pv.surface,pv.sid,null,null); return; }
  const w=e.target.closest('.w');
  if(w){ const r=resolve(w.dataset.w,w.dataset.k); openWord(r,w.dataset.w,w.dataset.s,w); return; }
  const sw=e.target.closest('[data-sw]'); if(sw){ say(sw.dataset.sw); return; }
  const sx=e.target.closest('[data-sayx]'); if(sx){ say(sx.dataset.sayx); return; }
  if(e.target.closest('[data-say="demo"]')){ say(plain(first.de)); return; }
  const st=e.target.closest('[data-star]'); if(st){ toggleSave(st.dataset.star); return; }
  const jp=e.target.closest('[data-jump]'); if(jp){ navigate(C.textBook+'~s-'+jp.dataset.jump); return; }
  const op=e.target.closest('[data-open]'); if(op){ const id=op.dataset.open, f=id.replace(/^~/,'').split('#')[0]; openWord({w:f,id,cs:null,named:null,d:entryOf(id)}, f, null, null, !!op.closest('#sheet,#slipDesk')); return; }
  if(e.target.closest('.sheet-x')){ closeSheet(); $$('.w.on').forEach(x=>x.classList.remove('on')); return; }
  if(sheetOpen() && !e.target.closest('#sheet') && !e.target.closest('#backBtn')) closeSheet();
});
document.addEventListener('keydown',e=>{
  if(PL.on && e.key===' ' && !e.target.closest('input,textarea,button,.w,.vrow')){ e.preventDefault(); plToggle(); return; }
  if(e.key==='Escape') closeSheet();
  if((e.key==='Enter'||e.key===' ') && (e.target.classList?.contains('w')||e.target.classList?.contains('vrow'))){ e.preventDefault(); e.target.click(); }
});

/* ---------- every German word on the page is a dictionary link ----------
   Annotated sentences (.w) carry their own analysis. Everything else — titles, epigraphs, notes, lesson prose,
   word-slip text, footers — is scanned when it appears: Latin-script words are wrapped in .lw links,
   looked up first in the current book's lexicon, then in the shared dictionary (DICT). Hyphenated
   breakdowns (Mün-dig-keit, -ung, ver-) are tried whole first, then as prefix / suffix / stem. */
const LWRE=/(-?)([A-Za-zÀ-ÖØ-öø-ÿẞ]+(?:[-·][A-Za-zÀ-ÖØ-öø-ÿẞ]+)*)(-?)/g;
const HARD='.de,.w,.lw,script,style,svg,input,textarea,select,option,title,#toast,.sl-word,[data-nolink]';
const CTRL='button,a,[data-open],[data-route],[data-jump],[role="button"],.qopt,.tab';
function lk(key){
  if(C && C.LEX[key]) return key;
  if(DICT && DICT[key]) return '~'+key;
  return null;
}
function linkText(text){
  let out='', last=0, any=false, m; LWRE.lastIndex=0;
  const span=(t,id)=>{ any=true; return '<span class="lw" data-l="'+esc(id)+'" lang="de">'+esc(t)+'</span>'; };
  while((m=LWRE.exec(text))){
    const [,lead,chain,trail]=m, st=m.index+lead.length;
    out+=esc(text.slice(last,st)); last=st+chain.length;
    const parts=chain.split(/([-·])/);
    if(parts.length>1){ const id=lk(chain.replace(/[-·]/g,'').toLowerCase()); if(id){ out+=span(chain,id); continue; } }
    for(let i=0;i<parts.length;i+=2){
      const p=parts[i], lw=p.toLowerCase(), keys=[];
      if(i>0||lead) keys.push('-'+lw); if(i<parts.length-1||trail) keys.push(lw+'-'); keys.push(lw);
      let id=null; for(const k of keys){ id=lk(k); if(id) break; }
      out+=id?span(p,id):esc(p); if(i+1<parts.length) out+=esc(parts[i+1]);
    }
  }
  return any?out+esc(text.slice(last)):null;
}
function linkify(root){
  if(!DICT || !root) return;
  if(root.nodeType===3) root=root.parentElement; if(!root || root.nodeType!==1) return;
  if(root.closest(HARD)) return;
  const nodes=[], tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p=n.parentElement; if(!p || !/[A-Za-zÀ-ÿ]/.test(n.data)) return NodeFilter.FILTER_SKIP;
    if(p.closest(HARD)) return NodeFilter.FILTER_REJECT;
    if(p.closest(CTRL) && !p.closest('[data-linkok]')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; }});
  while(tw.nextNode()) nodes.push(tw.currentNode);
  for(const n of nodes){ const h=linkText(n.data); if(h==null) continue; const t=document.createElement('template'); t.innerHTML=h; n.replaceWith(t.content); }
}
new MutationObserver(ms=>{ if(!DICT) return; const seen=new Set(); for(const m of ms) for(const n of m.addedNodes){ if(seen.has(n)) continue; seen.add(n); if(n.nodeType===1||n.nodeType===3) linkify(n); } })
  .observe(document.body,{childList:true,subtree:true});
load('dict').then(d=>{ DICT=d; linkify(document.body); }).catch(()=>{});

/* ---------- colour themes ----------
   "Auto" (no data-theme) follows the system's light / dark setting; the others are fixed. Saved per device. */
const THEMES=[
  {id:'', name:'自动', desc:'跟随系统：白天用纸本，夜间用夜读', sw:['#f3f4f1','#1e3c6a','#111419']},
  {id:'light', name:'纸本', desc:'冷白纸、普鲁士蓝，每本书有自己的主色', sw:['#f3f4f1','#fbfbf9','#1e3c6a']},
  {id:'dark', name:'夜读', desc:'深色，适合晚上读', sw:['#111419','#171b21','#94b4e6']},
  {id:'wabi', name:'侘寂', desc:'米灰与陶土色，低饱和，安静克制', sw:['#eeeae3','#c8bfb0','#6b5a45']},
  {id:'roma', name:'罗马', desc:'石灰华、庞贝红与金，标题用碑铭体', sw:['#f3eee4','#962b1f','#a8801f'], font:'https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap'},
  {id:'aka', name:'赤焰', desc:'黑底，红与橙，高对比', sw:['#0f0b0b','#ff4b37','#ff8a1c']}
];
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0], r=document.documentElement;
  if(t.id) r.setAttribute('data-theme',t.id); else r.removeAttribute('data-theme');
  if(t.font && !document.getElementById('font-'+t.id)){ const l=document.createElement('link'); l.rel='stylesheet'; l.href=t.font; l.id='font-'+t.id; document.head.appendChild(l); }
  $$('.th-opt').forEach(b=>b.setAttribute('aria-checked',b.dataset.theme===t.id));
}
function renderThemeMenu(){
  const cur=UI.get('theme','');
  $('#themeMenu').innerHTML='<h4>配色主题</h4>'+THEMES.map(t=>'<button class="th-opt" role="menuitemradio" data-theme="'+t.id+'" aria-checked="'+(t.id===cur)+'"><span class="th-sw" aria-hidden="true">'+t.sw.map(c=>'<i style="background:'+c+'"></i>').join('')+'</span><b>'+esc(t.name)+'</b><small>'+esc(t.desc)+'</small><svg class="th-ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg></button>').join('');
}
function themeMenu(open){ const m=$('#themeMenu'); if(open==null) open=m.hidden; m.hidden=!open; $('#themeBtn').setAttribute('aria-expanded',open); if(open){ renderThemeMenu(); const c=m.querySelector('[aria-checked="true"]')||m.querySelector('.th-opt'); c&&c.focus({preventScroll:true}); } }
$('#themeBtn').addEventListener('click',e=>{ e.stopPropagation(); themeMenu(); });
$('#themeMenu').addEventListener('click',e=>{ e.stopPropagation(); const b=e.target.closest('.th-opt'); if(!b) return; UI.set('theme',b.dataset.theme); applyTheme(b.dataset.theme); themeMenu(false); if(e.detail===0) $('#themeBtn').focus({preventScroll:true}); });
document.addEventListener('click',e=>{ if(!$('#themeMenu').hidden && !e.target.closest('#themeMenu,#themeBtn')) themeMenu(false); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#themeMenu').hidden){ themeMenu(false); $('#themeBtn').focus({preventScroll:true}); } });
applyTheme(UI.get('theme',''));

/* ---------- boot ---------- */
if(LIB.sw && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
{ const t0=canon((location.hash||'').slice(1)); const t=validRoute(t0)?t0:'lib'; NAV.cur=t; render(t); histWrite({t,i:0},true); updateBack(); }
})();
