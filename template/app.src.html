/* ---------- every German word on the page is a dictionary link ----------
   Annotated sentences (.w) carry their own analysis. Everything else — titles, epigraphs, notes, lesson prose,
   word-slip text, footers — is scanned when it appears: Latin-script words are wrapped in .lw links,
   looked up first in the current book's lexicon, then in the shared dictionary (DICT). Hyphenated
   breakdowns (Mün-dig-keit, -ung, ver-) are tried whole first, then as prefix / suffix / stem. */
const LWRE=/(-?)([A-Za-zÀ-ÖØ-öø-ÿẞſ]+(?:[-·][A-Za-zÀ-ÖØ-öø-ÿẞſ]+)*)(-?)/g;  // ſ (long s, Fraktur) is looked up as s
const HARD='.de,.w,.lw,script,style,svg,input,textarea,select,option,title,#toast,.sl-word,[data-nolink]';
const CTRL='button,a,[data-open],[data-route],[data-jump],[role="button"],.qopt,.tab';
function lk(key){
  if(C && C.LEX[key]) return key;
  if(DICT && DICT[key]) return '~'+key;
  return null;
}
function linkText(text){
  let out='', last=0, any=false, m; LWRE.lastIndex=0;
  const span=(t,id)=>{ any=true; return '<span class="lw" data-l="'+esc(id)+'" lang="de">'+esc(t)+'</span>'; };
  while((m=LWRE.exec(text))){
    const [,lead,chain,trail]=m, st=m.index+lead.length;
    out+=esc(text.slice(last,st)); last=st+chain.length;
    const parts=chain.split(/([-·])/);
    if(parts.length>1){ const id=lk(chain.replace(/[-·]/g,'').toLowerCase().replace(/ſ/g,'s')); if(id){ out+=span(chain,id); continue; } }
    for(let i=0;i<parts.length;i+=2){
      const p=parts[i], lw=p.toLowerCase().replace(/ſ/g,'s'), keys=[];
      if(i>0||lead) keys.push('-'+lw); if(i<parts.length-1||trail) keys.push(lw+'-'); keys.push(lw);
      let id=null; for(const k of keys){ id=lk(k); if(id) break; }
      out+=id?span(p,id):esc(p); if(i+1<parts.length) out+=esc(parts[i+1]);
    }
  }
  return any?out+esc(text.slice(last)):null;
}
function linkify(root){
  if(!DICT || !root) return;
  if(root.nodeType===3) root=root.parentElement; if(!root || root.nodeType!==1) return;
  if(root.closest(HARD)) return;
  const nodes=[], tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    const p=n.parentElement; if(!p || !/[A-Za-zÀ-ÿ]/.test(n.data)) return NodeFilter.FILTER_SKIP;
    if(p.closest(HARD)) return NodeFilter.FILTER_REJECT;
    if(p.closest(CTRL) && !p.closest('[data-linkok]')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; }});
  while(tw.nextNode()) nodes.push(tw.currentNode);
  for(const n of nodes){ const h=linkText(n.data); if(h==null) continue; const t=document.createElement('template'); t.innerHTML=h; n.replaceWith(t.content); }
}
new MutationObserver(ms=>{ if(!DICT) return; const seen=new Set(); for(const m of ms) for(const n of m.addedNodes){ if(seen.has(n)) continue; seen.add(n); if(n.nodeType===1||n.nodeType===3) linkify(n); } })
  .observe(document.body,{childList:true,subtree:true});
load('dict').then(d=>{ DICT=d; linkify(document.body); }).catch(()=>{});

/* ---------- 德英词典 (Wörterbuch) ----------
   Data: docs/wb/meta.json + one shard per folded two- or three-letter prefix (built by scripts/dict/build_dict.py from
   English Wiktionary via kaikki.org, Tatoeba, the Leipzig corpus and this site's own books). Shards load on demand;
   「下载完整词典」 fetches all of them so the service worker keeps them for offline use. Routes: #wb, #wb/<word>. */
const WB={meta:null, metaP:null, shards:{}, q:'', seq:0};
const wbStore=mkStore('reader.wb.');
const wfold=w=>w.toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/[ßẞ]/g,'ss').normalize('NFKD').replace(/[^a-z]/g,'');
function wbMeta(){
  if(WB.meta) return Promise.resolve(WB.meta);
  if(!WB.metaP) WB.metaP=fetch('wb/meta.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(m=>{ WB.meta=m; WB.keys=Object.keys(m.keys).sort(); return m; }).catch(e=>{ WB.metaP=null; throw e; });
  return WB.metaP;
}
function wbShard(k){
  if(!WB.shards[k]) WB.shards[k]=fetch('wb/'+k+'.json?v='+WB.meta.v).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(e=>{ delete WB.shards[k]; throw e; });
  return WB.shards[k];
}
// shards are keyed by folded prefixes of different lengths (a shard that got too big hands its longer words on to
// keys one letter longer). A word lives in the deepest key that is a prefix of it, so load every key on the path;
// for search suggestions also the keys one level below.
function wbKeysFor(fq, deep){
  if(!fq) return [];
  const p=fq.length<2?(fq+'__').slice(0,2):fq;
  return WB.keys.filter(k=>p.startsWith(k) || (deep && k.length===p.length+1 && k.startsWith(p)));
}
async function wbLoad(fq,deep){ const ks=wbKeysFor(fq,deep); const sh=await Promise.all(ks.map(wbShard)); return sh; }
const WBPOS={noun:'名词',verb:'动词',adj:'形容词',adv:'副词',prep:'介词',conj:'连词',pron:'代词',det:'限定词',article:'冠词',num:'数词',
  intj:'感叹词',particle:'小品词',name:'专名',phrase:'短语',prefix:'前缀',suffix:'后缀',abbrev:'缩写',contraction:'缩合词',proverb:'谚语',
  prep_phrase:'介词短语',postp:'后置词',affix:'词缀',character:'字母',symbol:'符号'};
const WBTAG={nominative:'主格',genitive:'属格',dative:'与格',accusative:'宾格',singular:'单数',plural:'复数',present:'现在时',past:'过去时',
  preterite:'过去时',perfect:'完成时',participle:'分词',infinitive:'不定式',imperative:'命令式','subjunctive-i':'第一虚拟式','subjunctive-ii':'第二虚拟式',
  subjunctive:'虚拟式',indicative:'直陈式','first-person':'第一人称','second-person':'第二人称','third-person':'第三人称',comparative:'比较级',
  superlative:'最高级',positive:'原级',auxiliary:'助动词',definite:'定冠词',indefinite:'不定冠词',masculine:'阳性',feminine:'阴性',neuter:'中性',
  diminutive:'指小',strong:'强变化',weak:'弱变化',mixed:'混合变化',predicative:'表语',attributive:'定语',alt:'异体',obsolete:'旧',dated:'过时',
  archaic:'古',transitive:'及物',intransitive:'不及物',reflexive:'反身',colloquial:'口语',informal:'非正式',formal:'正式',rare:'少见',
  figuratively:'比喻',literary:'书面',slang:'俚语',vulgar:'粗俗',derogatory:'贬义',humorous:'诙谐',regional:'地区',Austria:'奥地利',
  Switzerland:'瑞士','Southern-Germany':'南德','Northern-Germany':'北德',uncountable:'不可数',countable:'可数','plural-only':'只用复数',
  'singular-only':'只用单数',impersonal:'无人称','with-dative':'+与格','with-genitive':'+属格','with-accusative':'+宾格',law:'法律',philosophy:'哲学',
  physics:'物理',mathematics:'数学',theology:'神学',historical:'历史',poetic:'诗歌',pejorative:'贬义',dialectal:'方言',Christianity:'基督教',
  music:'音乐',military:'军事',medicine:'医学',biology:'生物',chemistry:'化学',grammar:'语法',linguistics:'语言学',zu:'带 zu',separable:'可分',
  inseparable:'不可分',alternative:'异体','infinitive-zu':'带 zu 不定式',nonstandard:'不规范',feminine_equivalent:'阴性对应词','error-unknown-tag':''};
const TAGCODE={N:'nominative',G:'genitive',D:'dative',A:'accusative',s:'singular',p:'plural','1':'first-person','2':'second-person','3':'third-person',
  pr:'present',pa:'past',pt:'preterite',k1:'subjunctive-i',k2:'subjunctive-ii',im:'imperative',pc:'participle',if:'infinitive',cp:'comparative',
  sp:'superlative',ax:'auxiliary',m:'masculine',f:'feminine',n:'neuter',dm:'diminutive',zu:'zu',pd:'predicative'};
const untag=t=>String(t||'').split(' ').map(c=>TAGCODE[c]||c).join(' ');
// form index entries are "headword" or "headword|alt" (old / variant spelling)
const fHead=v=>{ const i=v.indexOf('|'); return i<0?[v,'']:[v.slice(0,i),v.slice(i+1)]; };
const fHow=h=>h==='alt'?'旧拼写或异体':'';
const wbAudio=p=>'https://upload.wikimedia.org/wikipedia/commons/'+(/\.mp3$/i.test(p)?p:'transcoded/'+p+'/'+p.split('/').pop()+'.mp3');
const wbTags=s=>(Array.isArray(s)?s:String(s||'').split(' ')).filter(Boolean).map(t=>WBTAG[t]!=null?WBTAG[t]:t).filter(Boolean).join(' ');
const ART={m:'der',f:'die',n:'das'};
const sizeMB=b=>(b/1048576).toFixed(b<1048576*10?1:0)+' MB';

/* ---- search ---- */
async function wbSearch(q){
  const seq=++WB.seq, fq=wfold(q), box=$('#wbList');
  if(fq.length<2){ box.innerHTML=fq?'<p class="wb-hint">再输入一个字母……</p>':''; return; }
  let sh; try{ await wbMeta(); sh=await wbLoad(fq,true); }catch(e){ if(seq===WB.seq) box.innerHTML='<p class="wb-hint">词典数据加载失败。</p>'; return; }
  if(seq!==WB.seq) return;
  const ql=q.trim().toLowerCase(), rows=[], seen=new Set();
  const add=(w,how,ent)=>{ if(seen.has(w)) return; seen.add(w); rows.push({w,how,ent}); };
  for(const s of sh) for(const v of (s.f[ql]||[])) { const [w,how]=fHead(v); /* a form: point to its headword, which may live in another shard */ add(w,'「'+q.trim()+'」的'+(how?fHow(how).replace('或','/'):'原形'),null); }
  const cands=[];
  for(const s of sh) for(const w in s.e){ const f=wfold(w); if(f.startsWith(fq)) cands.push([w,s.e[w]]); }
  const rank=v=>Math.max(...v.map(e=>e.r||0));
  cands.sort((a,b)=>(b[0].toLowerCase()===ql)-(a[0].toLowerCase()===ql) || rank(b[1])-rank(a[1]) || a[0].length-b[0].length || a[0].localeCompare(b[0]));
  cands.slice(0,40).forEach(([w,v])=>add(w,'',v));
  if(!rows.length){ box.innerHTML='<p class="wb-hint">没有找到以「'+esc(q)+'」开头的词。</p>'; return; }
  box.innerHTML=rows.slice(0,40).map(r=>{ const e=r.ent&&r.ent[0];
    const sub=e?(WBPOS[e.p]||e.p)+(e.g?' · '+e.g.split('').map(g=>ART[g]).join('/'):'')+' — '+(e.s[0]?e.s[0][0]:''):r.how;
    return '<button class="wb-row" data-route="wb/'+esc(encodeURIComponent(r.w))+'"><b lang="de">'+esc(r.w)+'</b><span>'+esc(sub)+'</span></button>'; }).join('');
}

/* ---- inflection tables ---- */
const has=(t,...xs)=>xs.every(x=>t.includes(x));
function nounTable(fm){
  const C=['nominative','genitive','dative','accusative'], N=['singular','plural'], cell={};
  fm.forEach(([f,t])=>{ const ts=t.split(' '); const c=C.find(x=>ts.includes(x)), n=N.find(x=>ts.includes(x)); if(c&&n&&!ts.includes('indefinite')){ const k=c+n; (cell[k]=cell[k]||[]).includes(f)||(cell[k]=cell[k]||[]).push(f); } });
  if(Object.keys(cell).length<3) return '';
  return '<table class="tbl wb-tbl"><thead><tr><th></th><th>单数</th><th>复数</th></tr></thead><tbody>'+C.map(c=>'<tr><th>'+WBTAG[c]+'</th>'+N.map(n=>'<td lang="de">'+esc((cell[c+n]||['—']).join(' / '))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}
function verbTables(fm){
  const P=[['first-person','singular','ich'],['second-person','singular','du'],['third-person','singular','er/sie/es'],['first-person','plural','wir'],['second-person','plural','ihr'],['third-person','plural','sie/Sie']];
  const T=[['现在时',t=>t.includes('present')&&!t.some(x=>/subjunctive/.test(x))],['过去时',t=>(t.includes('past')||t.includes('preterite'))&&!t.includes('participle')&&!t.some(x=>/subjunctive/.test(x))],
    ['第一虚拟式',t=>t.includes('subjunctive-i')],['第二虚拟式',t=>t.includes('subjunctive-ii')]];
  const used=new Set(), grid=T.map(([name,ok])=>{ const row=P.map(([p,n])=>{ const v=[]; fm.forEach((x,i)=>{ const ts=x[1].split(' '); if(ok(ts)&&ts.includes(p)&&ts.includes(n)&&!ts.includes('imperative')&&!ts.includes('participle')){ used.add(i); if(!v.includes(x[0])) v.push(x[0]); } }); return v; }); return {name,row}; }).filter(g=>g.row.some(v=>v.length));
  const pick=f=>{ const v=[]; fm.forEach((x,i)=>{ if(f(x[1].split(' '))){ used.add(i); if(!v.includes(x[0])) v.push(x[0]); } }); return v; };
  const aux=pick(t=>t.includes('auxiliary')), p2=pick(t=>has(t,'participle','past')), p1=pick(t=>has(t,'participle','present')),
        imp=[pick(t=>has(t,'imperative','singular')),pick(t=>has(t,'imperative','plural'))], zu=pick(t=>t.includes('infinitive-zu')||(t.includes('zu')&&t.includes('infinitive')));
  const g3=grid.find(g=>g.name==='现在时'), gp=grid.find(g=>g.name==='过去时');
  const prin=[['er 现在时',g3&&g3.row[2]],['过去时',gp&&gp.row[0]],['第二分词',p2],['助动词',aux]].filter(x=>x[1]&&x[1].length);
  let h='';
  if(prin.length) h+='<div class="wb-prin">'+prin.map(([k,v])=>'<span><small>'+k+'</small><b lang="de">'+esc(v.join(' / '))+'</b></span>').join('')+'</div>';
  if(grid.length) h+='<div class="scroll"><table class="tbl wb-tbl wb-conj"><thead><tr><th></th>'+grid.map(g=>'<th>'+g.name+'</th>').join('')+'</tr></thead><tbody>'+
    P.map((p,pi)=>'<tr><th lang="de">'+p[2]+'</th>'+grid.map(g=>'<td lang="de">'+esc(g.row[pi].join(' / ')||'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  const more=[['命令式',imp[0].concat(imp[1])],['第一分词',p1],['带 zu 不定式',zu]].filter(x=>x[1].length);
  if(more.length) h+='<div class="wb-prin">'+more.map(([k,v])=>'<span><small>'+k+'</small><b lang="de">'+esc(v.join(' / '))+'</b></span>').join('')+'</div>';
  return {h, used};
}
// adjective endings are regular: the table is generated from the stem (Wiktionary's own tables are dropped to save space)
function adjTable(lemma, fm){
  const cmp=fm.filter(x=>x[1].split(' ').includes('comparative')).map(x=>x[0]), sup=fm.filter(x=>x[1].split(' ').includes('superlative')).map(x=>x[0]);
  let h='';
  if(cmp.length||sup.length) h+='<div class="wb-prin"><span><small>原级</small><b lang="de">'+esc(lemma)+'</b></span>'+(cmp.length?'<span><small>比较级</small><b lang="de">'+esc(cmp.join(' / '))+'</b></span>':'')+(sup.length?'<span><small>最高级</small><b lang="de">'+esc(sup.join(' / '))+'</b></span>':'')+'</div>';
  if(!/^[a-zäöüß]+$/.test(lemma)) return h;
  let st=lemma; if(/[^e]el$/.test(st)) st=st.slice(0,-2)+'l'; else if(/(au|eu)er$/.test(st)) st=st.slice(0,-2)+'r'; else if(st==='hoch') st='hoh'; else if(/e$/.test(st)) st=st.slice(0,-1);
  const S={strong:[['er','e','es','e'],['en','er','en','er'],['em','er','em','en'],['en','e','es','e']],weak:[['e','e','e','en'],['en','en','en','en'],['en','en','en','en'],['en','e','e','en']],mixed:[['er','e','es','en'],['en','en','en','en'],['en','en','en','en'],['en','e','es','en']]};
  const AR={strong:['','','',''],weak:['der','die','das','die'],mixed:['ein','eine','ein','keine']};
  const cs=['主格','属格','与格','宾格'], gs=['阳性','阴性','中性','复数'];
  h+='<details class="wb-more"><summary>形容词变格表（按规则生成）</summary>'+['strong','weak','mixed'].map(k=>'<div class="scroll"><table class="tbl wb-tbl"><caption>'+WBTAG[k]+(k==='weak'?'（定冠词后）':k==='mixed'?'（不定冠词后）':'（无冠词）')+'</caption><thead><tr><th></th>'+gs.map(g=>'<th>'+g+'</th>').join('')+'</tr></thead><tbody>'+
    cs.map((c,ci)=>'<tr><th>'+c+'</th>'+S[k][ci].map(e=>'<td lang="de">'+esc(st+e)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('')+'</details>';
  return h;
}
function formsHtml(w,e){
  const fm=(e.fm||[]).map(([f,t])=>[f,untag(t)]); if(!fm.length && e.p!=='adj') return '';
  let h='', used=new Set();
  if(e.p==='noun'){ h=nounTable(fm); if(h) fm.forEach((x,i)=>{ if(/nominative|genitive|dative|accusative/.test(x[1])) used.add(i); }); }
  else if(e.p==='verb'){ const v=verbTables(fm); h=v.h; used=v.used; }
  else if(e.p==='adj'){ h=adjTable(w,fm); fm.forEach((x,i)=>{ if(/comparative|superlative/.test(x[1])) used.add(i); }); }
  const shown=new Set(fm.filter((x,i)=>used.has(i)).map(x=>x[0]));
  const rest=fm.filter((x,i)=>!used.has(i) && x[0]!==w && !shown.has(x[0]) && !/auxiliary/.test(x[1]));
  if(rest.length) h+='<div class="wb-forms">'+rest.slice(0,30).map(([f,t])=>'<span><b lang="de">'+esc(f)+'</b>'+(t?' <small>'+esc(wbTags(t))+'</small>':'')+'</span>').join('')+'</div>';
  return h?'<section class="wb-sec"><h3>变形</h3>'+h+'</section>':'';
}

/* ---- examples: every word is clickable, the looked-up word is bold ---- */
function exDe(s, forms){
  return esc(s).replace(new RegExp('[A-Za-zÄÖÜäöüßẞÀ-ÖØ-öø-ÿ]+','g'),t=>'<span class="wbw'+(forms.has(t.toLowerCase())?' hit':'')+'">'+t+'</span>');
}
function examplesHtml(w,x,ents){
  if(!x) return '';
  const forms=new Set([w.toLowerCase()]); ents.forEach(e=>(e.fm||[]).forEach(([f,t])=>{ if(!/\bax\b/.test(t)) f.split(' ').forEach(p=>forms.add(p.toLowerCase())); }));
  // adjectives: their declined forms are not stored, so add the regular endings to the base, comparative and superlative
  ents.forEach(e=>{ if(e.p!=='adj') return; const bases=[w.toLowerCase()].concat((e.fm||[]).filter(([,t])=>/\b(cp|sp)\b/.test(t)).map(([f])=>f.toLowerCase().replace(/^am\s+/,'').replace(/en$/,'')));
    bases.forEach(b=>['','e','en','em','er','es'].forEach(x=>forms.add(b.replace(/e$/,'')+x))); });
  let h='';
  if(x.b) h+='<h4>本站书中的原句</h4><ul class="wb-ex">'+x.b.map(([de,zh,route,book])=>'<li><p class="de" lang="de">'+exDe(de,forms)+'</p><p class="wb-tr">'+esc(zh)+'</p><button class="wb-src" data-route="'+esc(route)+'">《'+esc(book)+'》 →</button></li>').join('')+'</ul>';
  if(x.t) h+='<h4>例句 <small>Tatoeba</small></h4><ul class="wb-ex">'+x.t.map(([de,en])=>'<li><p class="de" lang="de">'+exDe(de,forms)+'</p><p class="wb-tr" lang="en">'+esc(en)+'</p></li>').join('')+'</ul>';
  if(x.l) h+='<h4>真实语料 <small>Leipzig</small></h4><ul class="wb-ex">'+x.l.map(de=>'<li><p class="de" lang="de">'+exDe(de,forms)+'</p></li>').join('')+'</ul>';
  return h?'<section class="wb-sec">'+h+'</section>':'';
}
function entryHtml(w,ents,x){
  const zh=DICT&&DICT[w.toLowerCase()];
  let h='<header class="wb-head"><h2 lang="de">'+esc(w)+'</h2><button class="icon-btn" data-sw="'+esc(w)+'" aria-label="朗读" title="朗读">'+ICON.say+'</button></header>';
  if(zh) h+='<p class="wb-zh"><small>本站释义</small>'+esc(zh[3])+(zh[4]?'<span>'+esc(zh[4])+'</span>':'')+'</p>';
  ents.forEach(e=>{
    h+='<section class="wb-ent"><div class="wb-meta"><b>'+esc(WBPOS[e.p]||e.p)+'</b>'+(e.g?'<span lang="de">'+e.g.split('').map(g=>ART[g]).join(' / ')+' '+esc(w)+'</span>':'')+(e.i?'<span class="wb-ipa">'+esc(e.i)+'</span>':'')+(e.a?'<button class="wb-audio" data-audio="'+esc(wbAudio(e.a))+'">真人发音</button>':'')+'</div>';
    h+='<ol class="wb-senses">'+e.s.map(([g,t,ex])=>'<li><span class="wb-g" lang="en">'+esc(g)+'</span>'+(t&&t.length?' <small>'+esc(wbTags(t))+'</small>':'')+
      (ex&&ex.length?'<ul class="wb-sx">'+ex.map(([d,tr])=>'<li><span lang="de">'+esc(d)+'</span>'+(tr?'<i lang="en">'+esc(tr)+'</i>':'')+'</li>').join(''):'')+(ex&&ex.length?'</ul>':'')+'</li>').join('')+'</ol>';
    h+=formsHtml(w,e);
    if(e.et) h+='<details class="wb-more"><summary>词源</summary><p lang="en">'+esc(e.et)+'</p></details>';
    h+='</section>';
  });
  h+=examplesHtml(w,x,ents);
  h+='<p class="wb-cite">释义、变形与词源：英文维基词典（Wiktionary，CC BY-SA 4.0，经 kaikki.org 整理）。例句：Tatoeba（CC BY 2.0 FR）、莱比锡大学语料库（CC BY 4.0）。</p>';
  return h;
}
async function wbOpen(word){
  const seq=++WB.seq, box=$('#wbEntry');
  $('#wbList').innerHTML=''; box.innerHTML='<p class="wb-hint">正在查……</p>';
  try{ await wbMeta(); }catch(e){ box.innerHTML=wbMissing(); return; }
  const fq=wfold(word), ql=word.toLowerCase();
  let sh; try{ sh=await wbLoad(fq); }catch(e){ box.innerHTML='<p class="wb-hint">加载失败，请检查网络后重试。</p>'; return; }
  if(seq!==WB.seq) return;
  let heads=[];
  for(const s of sh) for(const w in s.e) if(w===word || w.toLowerCase()===ql) heads.push([w,s.e[w],s.x[w]]);
  if(!heads.length){
    const to=[]; for(const s of sh) for(const v of (s.f[ql]||[])){ const [w,how]=fHead(v); if(!to.some(t=>t[0]===w)) to.push([w,how]); }
    if(to.length===1){ navigate('wb/'+encodeURIComponent(to[0][0]),{replace:true}); return; }
    box.innerHTML=to.length?'<p class="wb-hint">「'+esc(word)+'」是这些词的变形：</p><div class="wb-list">'+to.map(([w,how])=>'<button class="wb-row" data-route="wb/'+esc(encodeURIComponent(w))+'"><b lang="de">'+esc(w)+'</b><span>'+esc(fHow(how))+'</span></button>').join('')+'</div>'
      :'<p class="wb-hint">词典里没有「'+esc(word)+'」。</p>';
    return;
  }
  // the exact spelling wins (schön the adjective, not Schön the surname); other capitalisations become "see also"
  const exact=heads.filter(h=>h[0]===word), main=exact.length?exact:heads, other=exact.length?heads.filter(h=>h[0]!==word):[];
  box.innerHTML=main.map(([w,e,x])=>entryHtml(w,e,x)).join('<hr class="wb-hr">')+
    (other.length?'<p class="wb-also">另见 '+other.map(([w,e])=>'<button class="wb-src" data-route="wb/'+esc(encodeURIComponent(w))+'" lang="de">'+esc(w)+'</button> <small>'+esc(WBPOS[e[0].p]||e[0].p)+'</small>').join('、')+'</p>':'');
  // which other headwords this spelling is also a form of
  const also=[]; for(const s of sh) for(const v of (s.f[ql]||[])){ const [w,how]=fHead(v); if(how!=='alt' && !heads.some(h=>h[0]===w) && !also.some(a=>a[0]===w)) also.push([w,how]); }
  if(also.length) box.insertAdjacentHTML('afterbegin','<p class="wb-also">「'+esc(word)+'」也是 '+also.map(([w,how])=>'<button class="wb-src" data-route="wb/'+esc(encodeURIComponent(w))+'" lang="de">'+esc(w)+'</button>'+(how?' <small>'+fHow(how)+'</small>':'')).join('、')+' 的变形</p>');
}
function wbMissing(){ return '<p class="wb-hint">词典数据还没有生成（docs/wb/meta.json 不存在）。</p>'; }

/* ---- offline: fetch every shard once; the service worker caches versioned files for good ---- */
async function wbInfo(){
  const el=$('#wbInfo'); let m; try{ m=await wbMeta(); }catch(e){ el.innerHTML=''; return; }
  const tot=m.gz||Object.values(m.keys).reduce((a,b)=>a+b,0), full=wbStore.get('full','')===m.v;
  el.innerHTML='<span>收录 '+m.n.heads.toLocaleString()+' 个词头 · '+m.n.forms.toLocaleString()+' 个变形</span>'+
    (full?'<span>已下载，可离线使用</span>':'<button class="wb-dl" id="wbDl">下载完整词典（约 '+sizeMB(tot)+'），离线也能查</button>');
}
async function wbDownload(btn){
  const m=await wbMeta(), ks=WB.keys; let done=0, fail=0, i=0;
  if(navigator.storage&&navigator.storage.persist) try{ await navigator.storage.persist(); }catch(e){}
  btn.disabled=true;
  const step=()=>{ btn.textContent='正在下载 '+done+' / '+ks.length+(fail?'（失败 '+fail+'）':'')+'……'; };
  step();
  const worker=async()=>{ while(i<ks.length){ const k=ks[i++]; try{ const r=await fetch('wb/'+k+'.json?v='+m.v); if(!r.ok) throw 0; await r.arrayBuffer(); }catch(e){ fail++; } done++; step(); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(!fail){ wbStore.set('full',m.v); toast('词典已下载，离线也能查'); }
  else toast('有 '+fail+' 个分片没下载成功，再点一次会接着下');
  wbInfo();
}
function wbShow(word){
  wbInfo();
  const inp=$('#wbQ');
  if(word){ inp.value=word; wbOpen(word); }
  else { $('#wbEntry').innerHTML=''; if(inp.value) wbSearch(inp.value); setTimeout(()=>inp.focus({preventScroll:true}),0); }
}
let wbT=0;
$('#wbQ').addEventListener('input',e=>{ clearTimeout(wbT); const v=e.target.value; $('#wbEntry').innerHTML=''; wbT=setTimeout(()=>wbSearch(v),120); });
$('#wbQ').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(v) navigate('wb/'+encodeURIComponent(v)); } });
$('#v-wb').addEventListener('click',e=>{
  const b=e.target.closest('.wbw'); if(b){ navigate('wb/'+encodeURIComponent(b.textContent)); return; }
  const a=e.target.closest('[data-audio]'); if(a){ try{ new Audio(a.dataset.audio).play().catch(()=>toast('离线时听不了真人发音')); }catch(x){} return; }
  if(e.target.closest('#wbDl')) wbDownload(e.target.closest('#wbDl'));
});

/* ---------- colour themes ----------
   "Auto" (no data-theme) follows the system's light / dark setting; the others are fixed. Saved per device. */
const THEMES=[
  {id:'', name:'自动', desc:'跟随系统：白天用白底，夜里用夜读'},
  {id:'light', name:'白天', desc:'白底黑字，一个点缀色'},
  {id:'dark', name:'夜读', desc:'深底浅字，适合晚上'},
  {id:'paper', old:1, name:'纸本', desc:'冷白纸、普鲁士蓝，每本书有自己的主色'},
  {id:'wabi', old:1, name:'侘寂', desc:'米灰与陶土色，低饱和，安静克制'},
  {id:'roma', old:1, name:'罗马', desc:'石灰华与庞贝红，标题用碑铭体', font:'https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap'},
  {id:'aka', old:1, name:'赤焰', desc:'黑底，红与橙，高对比'}
];
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0], r=document.documentElement;
  if(t.id) r.setAttribute('data-theme',t.id); else r.removeAttribute('data-theme');
  if(t.font && !document.getElementById('font-'+t.id)){ const l=document.createElement('link'); l.rel='stylesheet'; l.href=t.font; l.id='font-'+t.id; document.head.appendChild(l); }
  $$('.th-opt').forEach(b=>b.setAttribute('aria-checked',b.dataset.theme===t.id));
}
function renderThemeMenu(){
  const cur=UI.get('theme','');
  $('#themeMenu').innerHTML='<h4>配色主题</h4>'+THEMES.map(t=>(t.old&&!THEMES[THEMES.indexOf(t)-1].old?'<h4>旧主题</h4>':'')+'<button class="th-opt" role="menuitemradio" data-theme="'+t.id+'" aria-checked="'+(t.id===cur)+'"><b>'+esc(t.name)+'</b><small>'+esc(t.desc)+'</small><svg class="th-ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg></button>').join('');
}
function themeMenu(open){ const m=$('#themeMenu'); if(open==null) open=m.hidden; m.hidden=!open; $('#themeBtn').setAttribute('aria-expanded',open); if(open){ renderThemeMenu(); const c=m.querySelector('[aria-checked="true"]')||m.querySelector('.th-opt'); c&&c.focus({preventScroll:true}); } }
$('#themeBtn').addEventListener('click',e=>{ e.stopPropagation(); themeMenu(); });
$('#themeMenu').addEventListener('click',e=>{ e.stopPropagation(); const b=e.target.closest('.th-opt'); if(!b) return; UI.set('theme',b.dataset.theme); applyTheme(b.dataset.theme); themeMenu(false); if(e.detail===0) $('#themeBtn').focus({preventScroll:true}); });
document.addEventListener('click',e=>{ if(!$('#themeMenu').hidden && !e.target.closest('#themeMenu,#themeBtn')) themeMenu(false); },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#themeMenu').hidden){ themeMenu(false); $('#themeBtn').focus({preventScroll:true}); } });
applyTheme(UI.get('theme',''));

/* ---------- boot ---------- */
if(LIB.sw && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
{ const t0=canon((location.hash||'').slice(1)); const t=validRoute(t0)?t0:'lib'; NAV.cur=t; render(t); histWrite({t,i:0},true); updateBack(); }
})();
</script>
