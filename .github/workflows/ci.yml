name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate texts, lexicons and site-wide dictionary coverage
        run: python3 scripts/check.py
      - name: Build and make sure docs/ is up to date
        run: |
          python3 scripts/build.py --standalone -o /tmp/site/index.html
          diff -r -x .nojekyll /tmp/site docs || (echo "docs/ 与源文件不一致：请运行 python3 scripts/build.py --standalone -o docs/index.html 后再提交" && exit 1)
      - name: Browser test
        run: |
          pip install playwright==1.47.0
          python3 -m playwright install --with-deps chromium
          python3 tests/e2e.py docs/index.html
